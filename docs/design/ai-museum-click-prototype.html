<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>AI Museum · Click Prototype</title>
  <style>
    :root{--bg:#eaf7ff;--surface:#fffdf7;--ink:#18304b;--muted:#64798e;--primary:#ff7d66;--accent:#64b7f6;--accent2:#ffd45a;--line:#d7e5ed;--good:#2a8c65;--bad:#b94c4c;--shadow:0 18px 55px rgba(30,65,94,.13)}
    [data-theme="adult"]{--bg:#edf1f4;--surface:#fff;--ink:#1f2b38;--muted:#5e6b77;--primary:#315f88;--accent:#8195a8;--accent2:#b79b67;--line:#d8dee3;--shadow:0 14px 42px rgba(24,36,48,.11)}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,"PingFang SC","Microsoft YaHei",sans-serif;line-height:1.55}button,input,textarea,select{font:inherit;color:inherit}button{cursor:pointer}.shell{min-height:100vh;background:radial-gradient(circle at 10% 10%,rgba(255,255,255,.85) 0 5px,transparent 6px) 0 0/70px 70px,var(--bg)}[data-theme="adult"] .shell{background:linear-gradient(135deg,#edf1f4,#e6ebef)}
    .proto{height:38px;background:#182331;color:#d9e2ea;display:flex;align-items:center;gap:10px;padding:0 15px;font-size:11px;position:sticky;top:0;z-index:20}.proto b{color:white}.proto select{background:#27374a;color:white;border:1px solid #415267;border-radius:6px;padding:3px 6px}.proto span{margin-left:auto}.appbar{height:68px;display:flex;align-items:center;padding:0 5vw;gap:20px;background:rgba(255,255,255,.72);backdrop-filter:blur(12px);border-bottom:1px solid var(--line);position:sticky;top:38px;z-index:15}.brand{font:800 19px Georgia,serif}.nav{display:flex;gap:7px}.nav button,.ghost{border:0;background:transparent;border-radius:10px;padding:8px 10px;font-weight:800;font-size:12px}.nav .active,.ghost:hover{background:var(--surface)}.profile{margin-left:auto;width:38px;height:38px;border-radius:50%;border:0;background:var(--accent2);font-size:10px;font-weight:900}.main{max-width:1050px;margin:auto;padding:42px 26px 80px}.hero{text-align:center;padding:28px 20px}.eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);font-weight:900}.hero h1{font-size:36px;line-height:1.15;margin:8px}.hero p{color:var(--muted);max-width:650px;margin:10px auto}.stage{background:var(--surface);border:1px solid var(--line);border-radius:28px;padding:28px;box-shadow:var(--shadow);max-width:760px;margin:20px auto;position:relative;overflow:hidden}.stage:after{content:"";position:absolute;width:180px;height:180px;border-radius:50%;background:var(--accent);opacity:.14;right:-60px;top:-80px}.person{display:flex;align-items:center;gap:22px;position:relative;z-index:1}.portrait{width:120px;height:120px;border-radius:50%;background:var(--ink);color:white;border:7px solid var(--accent2);display:grid;place-items:center;font:48px Georgia,serif;flex:none}.person h2{font-size:26px;margin:3px 0}.person p{font-size:12px;color:var(--muted)}.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:16px}.primary,.secondary,.danger{border:0;border-radius:12px;padding:10px 15px;font-weight:900;font-size:12px}.primary{background:var(--primary);color:white}.secondary{background:var(--surface);border:1px solid var(--line)}.danger{background:#f8e5e5;color:var(--bad)}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:13px}.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:17px;min-height:120px}.card h3{font-size:14px;margin:5px 0}.card p{font-size:10px;color:var(--muted)}.card button{margin-top:8px}.focus-card{max-width:680px;margin:20px auto}.gallery{display:flex;align-items:center;justify-content:center;gap:18px}.gallery .card{width:230px;text-align:center;opacity:.58;transform:scale(.9)}.gallery .card.current{opacity:1;transform:scale(1.04);box-shadow:var(--shadow)}.mini-face{width:76px;height:76px;border-radius:50%;background:var(--ink);color:white;display:grid;place-items:center;margin:auto;font:28px Georgia,serif;border:5px solid var(--accent2)}
    .chat{max-width:780px;margin:auto;background:rgba(255,255,255,.45);border-radius:24px;padding:18px}.chat-head{display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--line);padding:8px 5px 14px}.chat-head .mini-face{width:48px;height:48px;margin:0;font-size:18px;border-width:3px}.chat-head button{margin-left:auto}.messages{min-height:390px;padding:20px 6%}.bubble{max-width:82%;padding:12px 15px;border-radius:17px;margin:10px 0;font-size:13px}.bubble.user{margin-left:auto;background:var(--accent)}.bubble.ai{background:var(--surface);border:1px solid var(--line)}.bubble.note{border-left:4px solid #9b8ce5;background:#f2efff;color:#48566a;border-radius:0 12px 12px 0}.memory{background:#fff1bf;border:1px solid #ead074;border-radius:14px;padding:11px;font-size:12px}.composer{display:flex;gap:8px;background:var(--surface);border:2px solid var(--line);padding:8px;border-radius:15px}.composer textarea{border:0;outline:0;resize:none;flex:1;background:transparent;min-height:42px}.composer button{width:48px}.inline{display:flex;gap:7px;margin-top:9px}.inline button{border:0;background:var(--bg);border-radius:8px;padding:6px 9px;font-size:10px}.drawer,.modal{position:fixed;z-index:30;background:rgba(15,30,45,.36);inset:0;display:grid;place-items:center}.drawer{align-items:end}.panel{background:var(--surface);width:min(760px,94vw);border-radius:25px 25px 0 0;padding:25px;box-shadow:var(--shadow)}.modal .panel{border-radius:25px;max-width:680px}.source{display:grid;grid-template-columns:50px 1fr;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}.source i{width:42px;height:42px;border-radius:12px;background:#dff3e9;color:var(--good);display:grid;place-items:center;font-style:normal;font-weight:900}.source h3{font-size:13px;margin:0}.source p{font-size:10px;color:var(--muted);margin:4px 0}.map{height:390px;border-radius:24px;background:radial-gradient(circle at center,var(--surface),rgba(255,255,255,.2));position:relative;border:1px solid var(--line);margin-top:20px}.node{position:absolute;width:84px;height:84px;border-radius:50%;background:var(--surface);border:4px solid var(--accent);display:grid;place-items:center;text-align:center;font-size:11px;font-weight:900;z-index:2}.node.main{left:45%;top:38%;background:var(--ink);color:white;border-color:var(--accent2)}.node.a{left:15%;top:18%}.node.b{right:14%;top:18%}.node.c{left:20%;bottom:12%}.node.d{right:20%;bottom:11%}.timeline{display:flex;gap:9px;overflow:auto;margin-top:24px}.event{min-width:170px;background:var(--surface);border-top:4px solid var(--accent);padding:13px;border-radius:12px;font-size:11px}.form{max-width:700px;margin:20px auto;background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:24px}.field{margin:14px 0}.field label{font-size:11px;font-weight:900;display:block;margin-bottom:6px}.field input,.field textarea,.field select{width:100%;border:1px solid #c9d5dd;border-radius:10px;padding:10px;background:white}.help{font-size:9px;color:var(--muted);margin-top:5px}.banner{border-radius:15px;padding:12px 14px;background:#e7f0ff;border:1px solid #cbdcf5;font-size:11px;margin:14px 0}.banner.warn{background:#fff1d6;border-color:#ecd39a}.banner.bad{background:#fae9e9;border-color:#e7bcbc}.stepper{display:flex;gap:4px;margin:12px 0}.stepper i{height:5px;background:#d5dde3;border-radius:4px;flex:1}.stepper i.on{background:var(--primary)}.table{background:var(--surface);border:1px solid var(--line);border-radius:17px;overflow:hidden}.tr{display:grid;grid-template-columns:1.4fr .8fr .8fr;padding:12px;border-bottom:1px solid var(--line);font-size:11px}.tr:last-child{border:0}.tr.head{font-weight:900;color:var(--muted)}.progress-item{display:flex;gap:12px;align-items:center;padding:13px;border-bottom:1px solid var(--line)}.check{width:30px;height:30px;border-radius:50%;background:#daf1e6;color:var(--good);display:grid;place-items:center;font-weight:900}.check.wait{background:#f5ead0;color:#8d651a}.claim{font-size:20px;font-weight:800;margin:14px 0}.quote{background:#f2f4f6;border-left:4px solid #8c9baa;padding:14px;font:13px Georgia,"Songti SC",serif}.tabs{display:flex;gap:7px;margin:12px 0}.tabs button{border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:7px 10px;font-size:10px}.tabs button.on{background:var(--ink);color:white}.screen-index{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}.screen-index button{text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px;font-size:10px}.hidden{display:none!important}.toast{position:fixed;z-index:50;right:20px;bottom:20px;background:var(--ink);color:white;padding:12px 16px;border-radius:12px;font-size:11px;box-shadow:var(--shadow)}
    .studio-shell{min-height:calc(100vh - 38px);background:#f5f7fa;display:grid;grid-template-columns:190px 1fr}.studio-side{background:#243247;color:white;padding:22px 15px}.studio-side b{font-size:15px}.studio-side button{width:100%;text-align:left;color:#c2ccd8;background:transparent;border:0;border-radius:8px;padding:10px;margin:3px 0;font-size:11px}.studio-side button.active{background:#34475f;color:white}.studio-content{padding:32px;max-width:1050px}.studio-content .primary{background:#356cc8}.studio-content .hero{text-align:left;padding:0}.studio-content .hero h1{font-size:30px;margin-left:0}.metric{font-size:28px;font-weight:900}.studio-content .card{background:white}.studio-content .form{background:white}.studio-content .primary{box-shadow:none}.studio-content .stage{background:white}
    @media(max-width:780px){.main{padding:25px 14px}.grid,.screen-index{grid-template-columns:1fr}.gallery .card:not(.current){display:none}.person{display:block;text-align:center}.portrait{margin:auto}.studio-shell{display:block}.studio-side{display:flex;overflow:auto;padding:10px}.studio-side b{display:none}.studio-side button{width:auto;white-space:nowrap}.studio-content{padding:20px}.appbar{padding:0 12px}.nav{display:none}.proto span{display:none}}
  </style>
</head>
<body data-theme="child"><div id="root"></div><div id="toast" class="toast hidden"></div>
<script>
const S={theme:'child',route:'V01',overlay:null,chatState:'idle',messages:[],studioStep:1};
const names={V01:'首次进入',V02:'人物馆',V03:'人物画廊',V04:'人物介绍',V05:'人物对话',V06:'人物切换',V07:'史料依据',V08:'关系图',V09:'时间线',V10:'我的探索',V11:'对话历史',V12:'记忆中心',V13:'记忆纠正',V14:'学习主题',V15:'设置与隐私',V16:'数据导出/删除',V17:'语音授权',V18:'Guide 路线',V19:'媒体合影授权',S01:'Studio入口',S02:'Dashboard',S03:'维护人物',S04:'创建身份',S05:'时代与边界',S06:'语言与表达',S07:'资料中心',S08:'资料许可',S09:'处理任务',S10:'候选队列',S11:'单条审核',S12:'冲突处理',S13:'实体消歧',S14:'关系预览',S15:'时间线预览',S16:'私有试聊',S17:'评测报告',S18:'发布前检查',S19:'审核中',S20:'退回修改',S21:'版本升级',S22:'Fork人物',S23:'包导入',S24:'包导出',S25:'协作者',S26:'Agent任务',S27:'媒体任务',X01:'全局异常状态'};
function go(r){S.route=r;S.overlay=null;location.hash=r;render();scrollTo(0,0)}function ov(r){S.overlay=r;render()}function closeOv(){S.overlay=null;render()}function toast(t){const e=document.querySelector('#toast');e.textContent=t;e.classList.remove('hidden');setTimeout(()=>e.classList.add('hidden'),1800)}
function proto(){return `<div class="proto"><b>可点击设计原型</b><select onchange="go(this.value)">${Object.entries(names).map(([k,v])=>`<option value="${k}" ${S.route===k?'selected':''}>${k} · ${v}</option>`).join('')}</select><button class="secondary" onclick="go('INDEX')">全部页面</button><span>无真实 API / 无数据写入</span></div>`}
function visitorNav(){return `<header class="appbar"><div class="brand">AI Museum</div><nav class="nav"><button class="${['V02','V03','V04'].includes(S.route)?'active':''}" onclick="go('V02')">人物馆</button><button class="${['V10','V11','V12','V14'].includes(S.route)?'active':''}" onclick="go('V10')">我的探索</button></nav><button class="profile" onclick="go('V15')">小宇</button></header>`}
function shell(content){return `${proto()}<div class="shell">${visitorNav()}<main class="main">${content}</main></div>${overlay()}`}
function studioShell(content,active='概览'){return `${proto()}<div class="studio-shell"><aside class="studio-side"><b>AI Museum Studio</b>${[['概览','S02'],['人物','S03'],['资料','S07'],['审核','S10'],['版本','S21'],['任务','S26']].map(x=>`<button class="${active===x[0]?'active':''}" onclick="go('${x[1]}')">${x[0]}</button>`).join('')}<button onclick="go('V02')">返回访客端</button></aside><main class="studio-content">${content}</main></div>${overlay()}`}
function overlay(){if(!S.overlay)return'';if(S.overlay==='V07')return `<div class="drawer"><section class="panel"><div class="eyebrow">这句话有 3 条史料依据</div><h2>“1927 年第五届索尔维会议”</h2><div class="source"><i>1</i><div><h3>索尔维科学会议档案</h3><p>会议名录及照片说明 · 布鲁塞尔 · 1927 年 10 月</p><button class="secondary" onclick="toast('原始定位预览')">查看原位置</button></div></div><div class="actions"><button class="secondary" onclick="toast('显示另外两条来源')">另外 2 条</button><button class="primary" onclick="closeOv()">看完了</button></div></section></div>`;if(S.overlay==='V06')return `<div class="modal"><section class="panel"><div class="eyebrow">换一位历史人物</div><h2>去问问尼尔斯·玻尔？</h2><p>会恢复你和玻尔 2 天前的对话。玻尔不会看到你和爱因斯坦的私聊。</p><div class="person"><div class="portrait" style="width:90px;height:90px;font-size:34px">B</div><div><b>上次聊到：互补性是什么</b><p>独立线程 · 人物包 1.0</p></div></div><div class="actions"><button class="secondary" onclick="closeOv()">先不换</button><button class="primary" onclick="closeOv();toast('已恢复玻尔的独立线程')">进入玻尔的对话</button></div></section></div>`;if(S.overlay==='V13')return `<div class="modal"><section class="panel"><h2>这段记忆哪里不对？</h2><div class="field"><label>人物记得的是</label><textarea id="memoryFix">我们上次谈过玻尔和量子争论。</textarea><div class="help">保存后旧记忆立即停止使用，新版本保留来源。</div></div><div class="actions"><button class="danger" onclick="closeOv();toast('这条记忆已暂停')">暂时别提</button><button class="secondary" onclick="closeOv()">取消</button><button class="primary" onclick="closeOv();toast('纠正已保存')">保存纠正</button></div></section></div>`;return''}
function V01(){return `${proto()}<div class="shell"><main class="main"><section class="hero"><div class="eyebrow">欢迎来到 AI Museum</div><h1>和历史人物聊一聊</h1><p>先选一个看起来舒服的界面。之后可以随时更换，不会改变功能和回答。</p></section><div class="grid" style="max-width:760px;margin:auto"><article class="card"><div class="mini-face" style="background:#ff7d66">☺</div><h3>轻快模式</h3><p>明亮场景、大字号和更活泼的视觉。</p><button class="${S.theme==='child'?'primary':'secondary'}" onclick="setTheme('child')">选这个</button></article><article class="card"><div class="mini-face" style="background:#315f88">A</div><h3>经典模式</h3><p>更克制的颜色与更安静的阅读感。</p><button class="${S.theme==='adult'?'primary':'secondary'}" onclick="setTheme('adult')">选这个</button></article><article class="card"><h3>你的隐私</h3><p>默认使用匿名身份；记忆可查看、纠正和关闭。</p><button class="secondary" onclick="toast('隐私说明抽屉')">隐私说明</button></article></div><div class="actions" style="justify-content:center"><button class="primary" onclick="go('V02')">开始探索 →</button></div></main></div>`}
function V02(){return shell(`<section class="hero"><div class="eyebrow">下午好，小宇</div><h1>继续我们的量子探险？</h1><p>上次爱因斯坦说到：他为什么不完全同意玻尔。</p></section><article class="stage"><div class="person"><div class="portrait">E</div><div><small>继续上次对话</small><h2>“概率真的是世界的答案吗？”</h2><p>爱因斯坦 · 刚刚聊过 · 已保存</p><div class="actions"><button class="primary" onclick="go('V05')">继续和我聊 →</button><button class="secondary" onclick="go('V03')">换个人物</button><button class="secondary" onclick="toast('问题：你和玻尔第一次见面在哪里？')">给我一个问题</button></div></div></div></article>`)}
function V03(){return shell(`<section class="hero"><div class="eyebrow">人物画廊</div><h1>想听谁讲历史？</h1></section><div class="gallery"><article class="card"><div class="mini-face">C</div><h3>居里夫人</h3><p>放射性与实验室</p></article><article class="card current"><div class="mini-face" style="background:#ff7d66">B</div><h3>尼尔斯·玻尔</h3><p>量子世界 · 2 天前聊过</p><div class="actions"><button class="primary" onclick="go('V04')">了解他</button><button class="secondary" onclick="go('V05')">直接聊聊</button></div></article><article class="card"><div class="mini-face">P</div><h3>普朗克</h3><p>能量与量子</p></article></div>`)}
function V04(){return shell(`<article class="stage"><div class="person"><div class="portrait" style="background:#ff7d66">B</div><div><div class="eyebrow">1885—1962 · 丹麦</div><h2>尼尔斯·玻尔</h2><p>我研究原子与量子理论，也和爱因斯坦进行过长期而友好的争论。</p><div class="tabs"><button class="on">量子理论</button><button>科学争论</button><button>研究生活</button></div><div class="actions"><button class="primary" onclick="go('V05')">开始对话</button><button class="secondary" onclick="go('V08')">看他认识谁</button><button class="ghost" onclick="go('V03')">返回</button></div></div></div></article>`)}
function V05(){const extra=S.messages.map(m=>`<div class="bubble ${m.role}">${m.text}</div>`).join('');return shell(`<section class="chat"><header class="chat-head"><div class="mini-face">E</div><div><b>爱因斯坦</b><div class="eyebrow">人物资料 1.2</div></div><button class="secondary" onclick="ov('V06')">换人物</button></header><main class="messages"><div class="memory">我记得我们上次说到玻尔和量子争论，对吗？<div class="inline"><button onclick="toast('记忆已确认')">对，我记得</button><button onclick="ov('V13')">不是这样</button></div></div><div class="bubble user">你和玻尔是怎么认识的？</div><div class="bubble ai">我们在 1920 年代的物理学会议上逐渐熟悉起来。最著名的一次是在 1927 年的第五届索尔维会议。我们常常争论，但我一直尊重他。<div class="inline"><button onclick="ov('V07')">✓ 看看依据</button><button onclick="go('V08')">沿着历史走下去 →</button></div></div><div class="bubble note"><b>博物馆旁白</b>　我可以在时间线上补充后来发生的事情。</div>${extra}<div id="stream"></div></main><form class="composer" onsubmit="sendChat(event)"><button type="button" class="secondary" onclick="go('V17')">🎙</button><textarea id="chatInput" placeholder="问问爱因斯坦……"></textarea><button class="primary" type="submit">${S.chatState==='streaming'?'停':'↑'}</button></form></section>`)}
function sendChat(e){e.preventDefault();if(S.chatState==='streaming'){S.chatState='idle';toast('已停止，部分回答保留');render();return}const el=document.querySelector('#chatInput');const t=el.value.trim();if(!t){toast('先写下你的问题');return}if(t.length>4000){toast('问题不能超过 4000 字');return}S.messages.push({role:'user',text:t});S.chatState='streaming';render();setTimeout(()=>{S.messages.push({role:'ai',text:'这是流式回答的模拟。真实版本会先检索正式史料，再逐句返回并核对引用。<div class="inline"><button onclick="ov(\'V07\')">看看依据</button></div>'});S.chatState='idle';render()},900)}
function V08(){return shell(`<section class="hero"><div class="eyebrow">当前问题：量子争论</div><h1>人物关系</h1><div class="tabs" style="justify-content:center"><button class="on">关系</button><button onclick="go('V09')">时间</button><button onclick="go('V05')">回到对话</button></div></section><div class="map"><button class="node main">爱因斯坦</button><button class="node a">普朗克</button><button class="node b" onclick="ov('V06')">玻尔</button><button class="node c">量子理论</button><button class="node d">索尔维会议</button></div>`)}
function V09(){return shell(`<section class="hero"><div class="eyebrow">当前问题：量子争论</div><h1>历史时间线</h1><div class="tabs" style="justify-content:center"><button onclick="go('V08')">关系</button><button class="on">时间</button><button onclick="go('V05')">回到对话</button></div></section><div class="timeline"><article class="event"><b>1905 · 人物亲历</b><p>光量子假说</p></article><article class="event"><b>1927 · 人物亲历</b><p>第五届索尔维会议</p></article><article class="event"><b>1935 · 人物亲历</b><p>EPR 论文</p></article><article class="event" style="border-color:#7b8792"><b>人物身后</b><p>现代量子计算</p></article></div>`)}
