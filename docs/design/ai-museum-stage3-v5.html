<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AI Museum · Stage 3 v5</title>
<style>
:root{--bg:#eaf7ff;--paper:#fffdf7;--ink:#18304b;--muted:#64798e;--line:#d6e5ed;--blue:#64b7f6;--yellow:#ffd45a;--coral:#ff7d66;--green:#42b883;--purple:#8f73de;--orange:#e88c38;--gold:#bd8a19;--shadow:0 20px 60px rgba(32,67,94,.14)}[data-theme=adult]{--bg:#edf1f4;--paper:#fff;--ink:#1f2b38;--muted:#5f6c78;--line:#d8dee3;--blue:#8095a8;--yellow:#b69a67;--coral:#315f88;--green:#527d69;--purple:#756d88;--orange:#9b7048;--gold:#92762e;--shadow:0 15px 45px rgba(24,36,48,.11)}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,"PingFang SC","Microsoft YaHei",sans-serif;line-height:1.55}body.lock{overflow:hidden}button,input{font:inherit;color:inherit}button{cursor:pointer}.proto{height:38px;background:#182331;color:#dbe4ec;padding:0 14px;display:flex;align-items:center;gap:9px;font-size:11px;position:sticky;top:0;z-index:30}.proto b{color:#fff}.proto select{background:#29394c;color:white;border:1px solid #42536a;border-radius:7px;padding:4px}.proto span{margin-left:auto}.shell{min-height:calc(100vh - 38px);background:radial-gradient(circle at 12% 12%,rgba(255,255,255,.75) 0 4px,transparent 5px) 0 0/72px 72px,var(--bg)}[data-theme=adult] .shell{background:linear-gradient(145deg,#edf1f4,#e4e9ed)}.top{height:68px;padding:0 5vw;display:flex;align-items:center;gap:18px;background:rgba(255,255,255,.78);backdrop-filter:blur(12px);border-bottom:1px solid var(--line);position:sticky;top:38px;z-index:20}.brand{font:800 19px Georgia,serif}.nav{display:flex;gap:5px}.nav button{border:0;background:transparent;padding:9px 11px;border-radius:10px;font-weight:800;font-size:12px}.nav .on{background:var(--paper)}.quick{margin-left:auto;width:min(220px,22vw);display:flex;align-items:center;gap:7px;background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:7px 10px}.quick input{width:100%;border:0;outline:0;background:transparent;font-size:10px}.stars{border:0;border-radius:999px;background:var(--yellow);padding:8px 11px;font-weight:900;font-size:11px}.avatar{width:38px;height:38px;border:0;border-radius:50%;background:var(--coral);color:#fff;font-size:10px;font-weight:900}.main{max-width:1120px;margin:auto;padding:38px 25px 80px}.hero{text-align:center;padding:22px 12px}.hero h1{font-size:37px;line-height:1.12;margin:8px}.hero p{max-width:680px;margin:8px auto;color:var(--muted);font-size:12px}.eyebrow{font-size:10px;color:var(--muted);font-weight:900;letter-spacing:.1em;text-transform:uppercase}.primary,.secondary,.quiet{border:0;border-radius:12px;padding:10px 14px;font-size:11px;font-weight:900}.primary{background:var(--coral);color:#fff}.secondary{background:var(--paper);border:1px solid var(--line)}.quiet{background:transparent;color:var(--muted)}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.stage{max-width:820px;margin:15px auto;background:var(--paper);border:1px solid var(--line);border-radius:28px;padding:27px;box-shadow:var(--shadow);display:flex;align-items:center;gap:22px}.face{width:104px;height:104px;border-radius:50%;background:var(--ink);color:#fff;border:7px solid var(--yellow);display:grid;place-items:center;font:42px Georgia,serif;flex:none}.stage h2{font-size:24px;margin:4px 0}.stage p,.card p{font-size:11px;color:var(--muted)}.today{max-width:820px;margin:13px auto;display:grid;grid-template-columns:1fr auto;align-items:center;gap:15px;background:rgba(255,255,255,.72);border:1px solid var(--line);border-radius:18px;padding:17px}.today h3{font-size:14px;margin:2px}.today p{font-size:10px;color:var(--muted);margin:2px}.reward{font-weight:900;color:var(--green)}.period-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:15px}.period-card{min-height:330px;border-radius:27px;padding:23px;color:#fff;display:flex;flex-direction:column;justify-content:flex-end;position:relative;overflow:hidden;box-shadow:var(--shadow)}.period-card:before{content:attr(data-mark);position:absolute;right:16px;top:-45px;font:190px Georgia,serif;opacity:.1}.period-card.tang{background:linear-gradient(145deg,#9d4230,#db9840)}.period-card.renaissance{background:linear-gradient(145deg,#315f54,#70a879)}.period-card.physics{background:linear-gradient(145deg,#213b73,#7358b8)}.period-card>*{position:relative}.period-card h2{font-size:22px;margin:5px 0}.period-card p{font-size:10px;opacity:.84}.heads{display:flex;margin:12px 0}.head{width:39px;height:39px;border:3px solid rgba(255,255,255,.8);background:var(--ink);border-radius:50%;display:grid;place-items:center;margin-left:-6px;font:14px Georgia,serif}.head:first-child{margin-left:0}.period-hero{border-radius:28px;padding:36px;color:#fff;min-height:280px;display:flex;flex-direction:column;justify-content:flex-end;position:relative;overflow:hidden}.period-hero.tang{background:linear-gradient(145deg,#8f392b,#d9933b)}.period-hero.renaissance{background:linear-gradient(145deg,#294f47,#69a078)}.period-hero.physics{background:linear-gradient(145deg,#1c3368,#6f55ad)}.period-hero:after{content:attr(data-mark);position:absolute;right:30px;top:-60px;font:260px Georgia,serif;opacity:.08}.period-hero>*{position:relative}.period-hero h1{font-size:38px;margin:4px 0}.period-hero p{font-size:11px;max-width:680px;opacity:.85}.section-title{display:flex;align-items:end;justify-content:space-between;margin:28px 0 12px}.section-title h2{margin:0;font-size:20px}.section-title p{margin:0;font-size:10px;color:var(--muted)}.hall-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.hall{background:var(--paper);border:1px solid var(--line);border-radius:20px;padding:18px;min-height:155px}.hall h3{font-size:15px;margin:5px 0}.hall p{font-size:10px;color:var(--muted)}.roster{display:grid;grid-template-columns:repeat(6,1fr);gap:10px}.person{aspect-ratio:3/4.3;border:4px solid #d2d3cf;border-radius:16px;background:var(--paper);padding:10px;display:flex;flex-direction:column;justify-content:flex-end;position:relative;overflow:hidden;box-shadow:0 7px 18px rgba(25,45,65,.07)}.person:before{content:attr(data-initial);position:absolute;inset:12px 12px 42%;border-radius:50%;background:var(--ink);color:#fff;display:grid;place-items:center;font:28px Georgia,serif}.person b{font-size:10px}.person small{font-size:8px;color:var(--muted)}.person.blue{border-color:var(--blue)}.person.purple{border-color:var(--purple)}.person.orange{border-color:var(--orange)}.person.gold{border-color:var(--gold);background:linear-gradient(145deg,#fffdf7,#fff0b8)}.person.locked{opacity:.65;filter:saturate(.4)}.person.locked:after{content:"看生平 · 对话待解锁";position:absolute;left:6px;right:6px;bottom:6px;background:rgba(24,48,75,.9);color:#fff;padding:5px;border-radius:7px;text-align:center;font-size:7px}.museum-top{display:grid;grid-template-columns:1.3fr 1fr;gap:14px}.panel{background:var(--paper);border:1px solid var(--line);border-radius:22px;padding:20px}.panel h2,.panel h3{margin:4px 0}.progress{height:10px;background:var(--line);border-radius:999px;overflow:hidden;margin:12px 0}.progress i{height:100%;display:block;border-radius:inherit;background:linear-gradient(90deg,var(--blue),var(--purple))}.group-progress{display:grid;gap:9px;margin-top:14px}.group-row{display:grid;grid-template-columns:1fr auto;gap:8px;background:var(--bg);border-radius:13px;padding:11px;font-size:10px}.pack-layout{display:grid;grid-template-columns:1.35fr .9fr;gap:15px}.pack-cover{min-height:440px;border-radius:28px;padding:30px;color:#fff;display:flex;flex-direction:column;justify-content:flex-end;position:relative;overflow:hidden}.pack-cover.tang{background:linear-gradient(145deg,#8f392b,#d9933b)}.pack-cover.renaissance{background:linear-gradient(145deg,#294f47,#69a078)}.pack-cover.physics{background:linear-gradient(145deg,#1c3368,#6f55ad)}.pack-cover:after{content:attr(data-mark);position:absolute;right:25px;top:-45px;font:230px Georgia,serif;opacity:.08}.pack-cover>*{position:relative}.pack-cover h1{font-size:38px;margin:5px 0}.pack-cover p{font-size:11px;opacity:.84}.rules{display:grid;gap:10px}.rule{background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:15px}.rule h3{font-size:13px;margin:0 0 7px}.rule p,.rule li{font-size:9px;color:var(--muted)}.odds{display:grid;grid-template-columns:repeat(5,1fr);gap:4px}.odd{text-align:center;background:var(--bg);border-radius:8px;padding:7px 2px;font-size:8px}.odd b{display:block}.ready{color:var(--green);font-weight:900}.modal-bg{position:fixed;inset:0;z-index:50;background:rgba(18,35,53,.48);backdrop-filter:blur(5px);display:grid;place-items:center;padding:18px}.modal{width:min(500px,100%);background:var(--paper);border-radius:24px;padding:24px;box-shadow:0 30px 90px rgba(18,35,53,.35)}.modal h2{margin:5px 0}.modal p{font-size:11px;color:var(--muted)}.confirm{display:flex;justify-content:space-between;background:var(--bg);border-radius:12px;padding:11px;margin:10px 0;font-size:11px}.reveal{width:min(780px,100%);min-height:520px;color:#fff;text-align:center;border-radius:30px;background:radial-gradient(circle at center,#a98de9,#253964 65%);padding:35px;display:grid;place-items:center;position:relative}.big-card{width:220px;aspect-ratio:3/4.25;border:8px solid var(--purple);border-radius:24px;background:linear-gradient(145deg,#fff,#e7ddff);color:var(--ink);padding:18px;display:flex;flex-direction:column;justify-content:flex-end;box-shadow:0 0 70px rgba(231,221,255,.65)}.big-card .portrait{flex:1;border-radius:50%;background:var(--ink);color:#fff;display:grid;place-items:center;font:80px Georgia,serif;margin-bottom:15px}.big-card h2{margin:0}.big-card p{font-size:9px;color:var(--muted)}.search-bg{position:fixed;inset:0;z-index:45;background:rgba(18,35,53,.38);backdrop-filter:blur(5px);display:grid;place-items:start center;padding:80px 18px}.search-modal{width:min(720px,100%);max-height:calc(100vh - 100px);overflow:auto;background:var(--bg);border-radius:24px;padding:20px;box-shadow:var(--shadow)}.search-head{display:flex;gap:8px;position:sticky;top:-20px;background:var(--bg);padding:2px 0 12px;z-index:2}.search-head input{flex:1;border:2px solid var(--line);border-radius:13px;padding:12px;background:var(--paper)}.result-label{font-size:11px;font-weight:900;margin:14px 2px 6px}.result{display:flex;align-items:center;gap:12px;background:var(--paper);border:1px solid var(--line);border-radius:15px;padding:12px;margin-top:8px}.result .face{width:56px;height:56px;border-width:4px;font-size:21px}.result div:nth-child(2){flex:1}.result h3{font-size:13px;margin:0}.result p{font-size:9px;color:var(--muted);margin:2px}.tag{display:inline-block;background:var(--bg);border-radius:999px;padding:4px 7px;font-size:8px;font-weight:800}.toast{position:fixed;right:18px;bottom:18px;z-index:80;background:var(--ink);color:#fff;border-radius:12px;padding:11px 14px;font-size:10px;box-shadow:var(--shadow)}.hidden{display:none}@media(max-width:800px){.main{padding:25px 14px}.nav{display:none}.quick{width:42px}.quick input{display:none}.period-grid,.hall-grid,.museum-top,.pack-layout{grid-template-columns:1fr}.roster{grid-template-columns:repeat(3,1fr)}.stage{display:block;text-align:center}.stage .face{margin:auto}.proto span{display:none}.search-bg{place-items:end center;padding:52px 0 0}.search-modal{height:calc(100vh - 52px);max-height:none;border-radius:24px 24px 0 0}}
</style>
<style>
/* Secondary buttons may sit inside dark period artwork. Keep their label color
   tied to the theme ink instead of inheriting the parent's white foreground. */
.secondary{color:var(--ink)}
</style>
</head>
<body data-theme="child"><div id="app"></div><div id="toast" class="toast hidden"></div>
<script>
const groups={
tang:{title:'盛唐与东亚交流',years:'618–907',place:'长安、洛阳、西域与东亚海路',mark:'唐',cls:'tang',question:'一个开放而繁荣的帝国，为什么也会经历巨大的战争与转折？',known:2,halls:['长安：诗人与世界城市','佛法东行与丝路旅行','安史之乱：盛世为何转折'],people:[['武则天','武','orange','时代人物'],['唐玄宗','玄','purple','核心人物'],['李白','李','gold','典藏人物'],['杜甫','杜','orange','时代人物'],['王维','王','blue','关键人物'],['玄奘','奘','purple','核心人物'],['鉴真','鉴','white','线索人物'],['颜真卿','颜','blue','关键人物'],['安禄山','安','purple','核心人物'],['郭子仪','郭','blue','关键人物'],['杨贵妃','杨','white','线索人物'],['阿倍仲麻吕','晁','white','线索人物']]},
renaissance:{title:'欧洲文艺复兴与早期科学革命',years:'约 1450–1650',place:'意大利城邦与欧洲知识网络',mark:'艺',cls:'renaissance',question:'艺术、印刷和观察，怎样一起改变人们理解世界的方式？',known:2,halls:['佛罗伦萨：艺术为何需要赞助人','罗马工作坊：大师如何竞争','从日心说到望远镜'],people:[['达·芬奇','达','gold','典藏人物'],['米开朗琪罗','米','orange','时代人物'],['拉斐尔','拉','purple','核心人物'],['洛伦佐·美第奇','洛','blue','关键人物'],['伊莎贝拉·德斯特','伊','blue','关键人物'],['索福尼斯巴','索','white','线索人物'],['马基雅维利','马','purple','核心人物'],['古腾堡','古','white','线索人物'],['哥白尼','哥','purple','核心人物'],['伽利略','伽','orange','时代人物'],['开普勒','开','blue','关键人物'],['维萨里','维','white','线索人物']]},
physics:{title:'现代物理革命',years:'1895–1969',place:'欧洲、北美与跨大西洋科学共同体',mark:'Q',cls:'physics',question:'科学家如何重新理解自然，又怎样面对战争与社会责任？',known:4,halls:['索尔维会议：自然是概率的吗','原子内部：理论与实验','流亡、战争与科学责任'],people:[['普朗克','P','purple','核心人物'],['居里夫人','C','orange','时代人物'],['卢瑟福','R','blue','关键人物'],['爱因斯坦','E','gold','典藏人物'],['尼尔斯·玻尔','B','orange','时代人物'],['莉泽·迈特纳','M','blue','关键人物'],['薛定谔','S','blue','关键人物'],['海森堡','H','purple','核心人物'],['泡利','Pa','white','线索人物'],['狄拉克','D','white','线索人物'],['奥本海默','O','purple','核心人物'],['吴健雄','W','white','线索人物']]}}
const st={route:'home',theme:'child',group:'physics',stars:120,owned:8,overlay:null};const labels={home:'主页',explore:'探索历史',period:'历史时期馆',museum:'我的博物馆',pack:'卡包详情'};
function toast(t){const e=document.querySelector('#toast');e.textContent=t;e.classList.remove('hidden');setTimeout(()=>e.classList.add('hidden'),1700)}
function go(r){st.route=r;st.overlay=null;location.hash=r;render();scrollTo(0,0)}function pickGroup(k,r='period'){st.group=k;go(r)}function setTheme(){st.theme=st.theme==='child'?'adult':'child';render();toast(st.theme==='child'?'儿童轻快模式':'成人经典模式')}
function openSearch(){if(st.overlay)return;st.overlay='search';document.body.classList.add('lock');document.body.insertAdjacentHTML('beforeend',overlay())}function closeOverlay(){const direct=st.overlay==='search';st.overlay=null;document.body.classList.remove('lock');if(direct){document.querySelector('.search-bg')?.remove();return}render()}function show(x){st.overlay=x;render()}
function proto(){return `<div class="proto"><b>Stage 3 v5</b><select onchange="go(this.value)">${Object.entries(labels).map(([k,v])=>`<option value="${k}" ${st.route===k?'selected':''}>${v}</option>`).join('')}</select><button class="secondary" onclick="setTheme()">切换 child / adult</button><span>3 个历史时期 · 36 位人物 · 可点击设计原型</span></div>`}
function nav(){return `<header class="top"><div class="brand">AI Museum</div><nav class="nav"><button class="${st.route==='home'?'on':''}" onclick="go('home')">主页</button><button class="${['explore','period'].includes(st.route)?'on':''}" onclick="go('explore')">探索历史</button><button class="${['museum','pack'].includes(st.route)?'on':''}" onclick="go('museum')">我的博物馆</button></nav><label class="quick" onclick="openSearch()"><span>⌕</span><input placeholder="搜索人物或关系" readonly></label><button class="stars" onclick="toast('探索星来自有效学习，不能购买')">✦ ${st.stars}</button><button class="avatar">小宇</button></header>`}function shell(c){return `${proto()}<div class="shell">${nav()}<main class="main">${c}</main></div>${st.overlay&&st.overlay!=='search'?overlay():''}`}
function home(){return shell(`<section class="hero"><div class="eyebrow">三个历史时期 · 36位人物</div><h1>今天继续哪一段历史？</h1></section><article class="stage"><div class="face">E</div><div><div class="eyebrow">继续上次对话 · 现代物理革命</div><h2>爱因斯坦与量子世界</h2><p>上次聊到：爱因斯坦为什么不完全同意玻尔。</p><div class="actions"><button class="primary" onclick="toast('恢复爱因斯坦长期线程')">继续和我聊 →</button><button class="secondary" onclick="pickGroup('physics')">回到这个时期</button></div></div></article><article class="today"><div><div class="eyebrow">今天的探索 · 不限时</div><h3>找到爱因斯坦和玻尔争论的一条史料依据</h3><p>重复消息或停留时间不会获得积分。</p></div><div><div class="reward">+20 探索星</div><button class="quiet" onclick="toast('有效对话 + 查看来源，奖励事件可追溯')">为什么？</button></div></article>`)}
function explore(){return shell(`<section class="hero"><div class="eyebrow">按历史时期开始</div><h1>选择一段想进入的历史</h1><p>每个时期有12位彼此相连的人物和至少3个历史展厅。</p></section><div class="period-grid">${Object.entries(groups).map(([k,g])=>`<article class="period-card ${g.cls}" data-mark="${g.mark}"><div class="eyebrow" style="color:#fff">${g.years} · 已认识 ${g.known}/12</div><h2>${g.title}</h2><p>${g.question}</p><div class="heads">${g.people.slice(0,3).map(p=>`<i class="head">${p[1]}</i>`).join('')}</div><button class="secondary" onclick="pickGroup('${k}')">进入这个时期</button></article>`).join('')}</div>`)}
function period(){const g=groups[st.group];return shell(`<section class="period-hero ${g.cls}" data-mark="${g.mark}"><div class="eyebrow" style="color:#fff">${g.years} · ${g.place}</div><h1>${g.title}</h1><p>${g.question}</p><div class="actions"><button class="secondary" onclick="pickGroup(st.group,'pack')">查看本时期卡包</button></div></section><div class="section-title"><div><div class="eyebrow">先从历史场景进入</div><h2>三个推荐展厅</h2></div><p>人物因共同历史相连</p></div><div class="hall-grid">${g.halls.map((h,i)=>`<article class="hall"><div class="eyebrow">展厅 ${i+1}</div><h3>${h}</h3><p>${i===0?'从一个核心问题认识人物之间的不同立场。':'沿事件、地点和正式关系继续探索。'}</p><button class="secondary" onclick="toast('进入展厅并选择起始人物')">进入展厅</button></article>`).join('')}</div><div class="section-title"><div><div class="eyebrow">本时期固定名册</div><h2>12位人物</h2></div><p>白3 · 蓝3 · 紫3 · 橙2 · 金1</p></div>${roster(g,true)}`)}
function roster(g,showAll=false){return `<div class="roster">${g.people.map((p,i)=>`<article class="person ${p[2]} ${i>=g.known?'locked':''}" data-initial="${p[1]}" onclick="toast('${i<g.known?'打开长期人物线程':'基本生平可浏览；获得后解锁长期对话'}')"><b>${p[0]}</b><small>${p[3]}</small></article>`).join('')}</div>`}
function museum(){return shell(`<section class="hero"><div class="eyebrow">我的博物馆</div><h1>已认识 ${st.owned} / 36 位人物</h1><p>卡牌解锁长期关系，但所有人物的基本生平与来源都可以浏览。</p></section><div class="museum-top"><article class="panel"><div class="eyebrow">总收藏进度</div><h2>${st.owned} / 36</h2><div class="progress"><i style="width:${st.owned/36*100}%"></i></div><button class="primary" onclick="go('explore')">选择历史时期</button></article><article class="panel"><div class="eyebrow">三个时期</div><div class="group-progress">${Object.entries(groups).map(([k,g])=>`<div class="group-row"><span>${g.title}</span><b>${g.known}/12</b><button class="quiet" onclick="pickGroup('${k}','pack')">卡包</button></div>`).join('')}</div></article></div><div class="section-title"><div><div class="eyebrow">最近探索</div><h2>现代物理革命 · 4/12</h2></div><button class="secondary" onclick="pickGroup('physics','period')">回到时期馆</button></div>${roster(groups.physics)}`)}
function pack(){const g=groups[st.group];return shell(`<div class="pack-layout"><article class="pack-cover ${g.cls}" data-mark="${g.mark}"><div class="eyebrow" style="color:#fff">${g.years} · 卡池版本 1.0</div><h1>${g.title}</h1><p>12/12人物内容就绪。人物达到来源、Claim、关系、边界和评测门槛后才进入本卡池。</p><div class="actions"><button class="primary" onclick="show('confirm')">用100探索星开启一次</button><button class="secondary" onclick="pickGroup(st.group,'period')">先看历史展厅</button></div></article><aside class="rules"><section class="rule"><h3 class="ready">✓ 12 / 12 人物已发布</h3><p>当前已认识 ${g.known}/12。抽取范围与人物版本固定并可审计。</p></section><section class="rule"><h3>五档分布与公开概率</h3><div class="odds"><div class="odd"><b>白 35%</b>3人</div><div class="odd"><b>蓝 30%</b>3人</div><div class="odd"><b>紫 20%</b>3人</div><div class="odd"><b>橙 10%</b>2人</div><div class="odd"><b>金 5%</b>1人</div></div><p>层级表示本时期中的策展深度，不评价人物价值。</p></section><section class="rule"><h3>保底与补偿</h3><p>保底进度 5/10。达到10次时保证获得尚未拥有的最高可用层级人物；重复卡转为20个史料碎片。</p></section><section class="rule"><h3>公平规则</h3><ul><li>探索星不能购买或过期。</li><li>动画可以跳过。</li><li>中断后恢复同一个结果。</li><li>收齐后停止随机抽取。</li></ul></section></aside></div><div class="section-title"><div><div class="eyebrow">本卡包全部人物</div><h2>固定12人</h2></div></div>${roster(g)}`)}
function overlay(){if(st.overlay==='confirm'){const g=groups[st.group];return `<div class="modal-bg" onclick="closeOverlay()"><section class="modal" onclick="event.stopPropagation()"><div class="eyebrow">开启前确认</div><h2>${g.title}</h2><p>随机获得本时期的一位人物。探索星不能购买，概率和保底已经公开。</p><div class="confirm"><span>当前余额</span><b>${st.stars} ✦</b></div><div class="confirm"><span>本次消耗</span><b>100 ✦</b></div><div class="actions"><button class="primary" onclick="draw()">确认开启</button><button class="secondary" onclick="closeOverlay()">先不打开</button></div></section></div>`}if(st.overlay==='reveal')return `<div class="modal-bg"><section class="reveal"><div><div class="eyebrow" style="color:#fff">紫卡 · 核心人物 · 现代物理革命</div><article class="big-card"><div class="portrait">O</div><h2>罗伯特·奥本海默</h2><p>理论物理、曼哈顿计划与科学责任</p></article><h2>新人物加入你的博物馆</h2><div class="actions" style="justify-content:center"><button class="primary" onclick="claim()">开始长期对话</button><button class="secondary" onclick="claim('period')">先看相关历史</button></div></div></section></div>`;if(st.overlay==='search')return `<div class="search-bg" onclick="closeOverlay()"><section class="search-modal" onclick="event.stopPropagation()"><header class="search-head"><input id="searchInput" value="爱因斯坦" aria-label="搜索人物或关系"><button class="secondary" onclick="closeOverlay()">关闭</button></header><div class="result-label">你搜索的人</div><article class="result"><div class="face">E</div><div><h3>阿尔伯特·爱因斯坦 · 已拥有</h3><p>现代物理革命 · 典藏人物</p><span class="tag">姓名完全匹配</span></div><button class="primary" onclick="closeOverlay();pickGroup('physics','period')">打开</button></article><div class="result-label">与爱因斯坦相关的人</div><article class="result"><div class="face" style="border-color:var(--orange)">B</div><div><h3>尼尔斯·玻尔 · 已拥有</h3><p>长期学术争论 · 共同参加索尔维会议</p></div><button class="secondary" onclick="toast('查看正式关系依据')">看关系</button></article><article class="result"><div class="face" style="border-color:var(--purple)">O</div><div><h3>罗伯特·奥本海默 · 尚未获得</h3><p>同在普林斯顿高等研究院 · 基本生平仍可浏览</p></div><button class="secondary" onclick="toast('打开公开生平，不跳转卡包广告')">看生平</button></article></section></div>`;return ''}
const baseOverlay=overlay;overlay=function(){if(st.overlay==='reveal'){const indexes={tang:8,renaissance:8,physics:10};const g=groups[st.group],p=g.people[indexes[st.group]];return `<div class="modal-bg"><section class="reveal"><div><div class="eyebrow" style="color:#fff">紫卡 · 核心人物 · ${g.title}</div><article class="big-card"><div class="portrait">${p[1]}</div><h2>${p[0]}</h2><p>${p[3]} · 从相关展厅开始认识</p></article><h2>新人物加入你的博物馆</h2><div class="actions" style="justify-content:center"><button class="primary" onclick="claim()">开始长期对话</button><button class="secondary" onclick="claim('period')">先看相关历史</button></div></div></section></div>`}return baseOverlay()};
function draw(){if(st.stars<100){closeOverlay();toast('探索星不足；完成一个真实历史探索即可继续');return}st.stars-=100;st.overlay='reveal';render()}function claim(route='museum'){const g=groups[st.group],indexes={tang:8,renaissance:8,physics:10},p=g.people[indexes[st.group]];st.overlay=null;st.owned++;g.known++;go(route);toast(p[0]+'已加入人物卡册')}
function render(){document.body.dataset.theme=st.theme;document.querySelector('#app').innerHTML=(window[st.route]||home)()}window.addEventListener('keydown',e=>{if(e.key==='Escape'&&st.overlay)closeOverlay()});window.addEventListener('hashchange',()=>{const r=location.hash.slice(1);if(labels[r]){st.route=r;render()}});if(labels[location.hash.slice(1)])st.route=location.hash.slice(1);render();
</script>
</body>
</html>
