<style>
:root{--bg:#eaf7ff;--paper:#fffdf7;--ink:#18304b;--muted:#536b80;--line:#c9dce7;--accent:#bd4535;--yellow:#ffd45a;--blue:#3f85bd;--green:#25765a;--purple:#7051b5;--orange:#ad5d24;--gold:#80600d;--body:18px;--small:14px;--control:48px;--shadow:0 18px 55px rgba(32,67,94,.15)}[data-theme=adult]{--bg:#edf1f4;--paper:#fff;--ink:#1f2b38;--muted:#52606d;--line:#ced7de;--accent:#315f88;--yellow:#b69a67;--blue:#426a8a;--green:#416c59;--purple:#635779;--orange:#805531;--gold:#745e24;--body:16px;--small:13px;--control:44px;--shadow:0 14px 40px rgba(24,36,48,.12)}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,"PingFang SC","Microsoft YaHei",sans-serif;font-size:var(--body);line-height:1.65}body.lock{overflow:hidden}button,input{font:inherit;color:inherit}button{cursor:pointer;min-height:var(--control)}button:focus-visible,input:focus-visible{outline:4px solid var(--yellow);outline-offset:3px}.proto{min-height:40px;background:#142131;color:#e4ecf2;padding:4px 14px;display:flex;align-items:center;gap:8px;font-size:12px;position:sticky;top:0;z-index:40}.proto b{color:#fff}.proto select,.proto button{min-height:30px;background:#26394e;color:#fff;border:1px solid #61748a;border-radius:8px;padding:3px 8px}.proto span{margin-left:auto}.shell{min-height:calc(100vh - 40px);background:radial-gradient(circle at 10% 12%,rgba(255,255,255,.8) 0 4px,transparent 5px) 0 0/76px 76px,var(--bg)}[data-theme=adult] .shell{background:linear-gradient(145deg,#edf1f4,#e4e9ed)}.top{min-height:74px;padding:8px 4vw;display:flex;align-items:center;gap:18px;background:rgba(255,255,255,.86);backdrop-filter:blur(12px);border-bottom:1px solid var(--line);position:sticky;top:40px;z-index:25}.brand{font:800 21px Georgia,serif}.nav{display:flex;gap:5px}.nav button{border:0;background:transparent;border-radius:12px;padding:9px 13px;font-weight:800}.nav .on{background:var(--paper);box-shadow:0 3px 12px rgba(30,50,70,.08)}.quick{margin-left:auto;width:min(260px,23vw);min-height:var(--control);display:flex;align-items:center;gap:8px;background:var(--paper);border:1px solid var(--line);border-radius:13px;padding:8px 12px}.quick input{width:100%;border:0;outline:0;background:transparent}.stars{border:1px solid #c6a32d;border-radius:999px;background:var(--yellow);padding:8px 13px;font-weight:900;white-space:nowrap}.avatar{width:var(--control);height:var(--control);border:0;border-radius:50%;background:var(--accent);color:#fff;font-weight:900}.main{max-width:1120px;margin:auto;padding:42px 24px 90px}.hero{text-align:center;padding:24px 12px}.hero h1{font-size:clamp(34px,4vw,48px);line-height:1.15;margin:8px}.hero p{max-width:720px;margin:10px auto;color:var(--muted)}.eyebrow{font-size:var(--small);color:var(--muted);font-weight:900;letter-spacing:.07em}.primary,.secondary,.quiet{border-radius:13px;padding:10px 17px;font-weight:900}.primary{border:1px solid #8e2f23;background:var(--accent);color:#fff}.secondary{border:1px solid var(--line);background:var(--paper);color:var(--ink)}.quiet{border:0;background:transparent;color:var(--muted);text-decoration:underline}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}.stage{max-width:850px;margin:16px auto;background:var(--paper);border:1px solid var(--line);border-radius:30px;padding:30px;box-shadow:var(--shadow);display:flex;align-items:center;gap:26px}.portrait{width:120px;height:120px;border-radius:28px;background:linear-gradient(145deg,#263c54,#17283c);color:#fff;border:6px solid var(--yellow);display:grid;place-items:center;font:46px Georgia,serif;flex:none;position:relative}.portrait:after{content:"肖像占位";position:absolute;bottom:5px;font:10px sans-serif;opacity:.7}.stage h2{font-size:30px;margin:3px 0}.stage p,.muted{color:var(--muted)}.today{max-width:850px;margin:14px auto;background:rgba(255,255,255,.78);border:1px solid var(--line);border-radius:20px;padding:20px;display:grid;grid-template-columns:1fr auto;gap:18px;align-items:center}.today h3{font-size:21px;margin:2px 0}.reward{font-weight:900;color:var(--green)}.period-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.period-card{min-height:380px;border:0;border-radius:28px;padding:26px;color:#fff;text-align:left;display:flex;flex-direction:column;justify-content:flex-end;position:relative;overflow:hidden;box-shadow:var(--shadow)}.period-card:before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.08) 10%,rgba(8,20,30,.78) 100%)}.period-card:after{content:attr(data-mark);position:absolute;right:16px;top:-42px;font:200px Georgia,serif;opacity:.1}.period-card.tang{background:linear-gradient(145deg,#8d3426,#b9692e)}.period-card.renaissance{background:linear-gradient(145deg,#214c43,#4c7d61)}.period-card.physics{background:linear-gradient(145deg,#1b3264,#5e48a0)}.period-card>*{position:relative}.period-card h2{font-size:28px;line-height:1.25;margin:6px 0}.period-card p{font-size:var(--small);margin:5px 0}.period-card .count{margin-top:15px;font-weight:900}.period-hero{border-radius:30px;padding:40px;color:#fff;min-height:330px;display:flex;flex-direction:column;justify-content:flex-end;position:relative;overflow:hidden}.period-hero:before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.05),rgba(7,19,29,.82))}.period-hero:after{content:attr(data-mark);position:absolute;right:28px;top:-70px;font:280px Georgia,serif;opacity:.09}.period-hero.tang{background:#9e4c29}.period-hero.renaissance{background:#356754}.period-hero.physics{background:#354783}.period-hero>*{position:relative}.period-hero h1{font-size:42px;line-height:1.18;margin:5px 0}.period-hero p{max-width:720px}.section-head{display:flex;align-items:end;justify-content:space-between;gap:16px;margin:34px 0 14px}.section-head h2{font-size:28px;margin:0}.section-head p{margin:0;color:var(--muted);font-size:var(--small)}.hall-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.hall{background:var(--paper);border:1px solid var(--line);border-radius:22px;padding:22px;min-height:210px;display:flex;flex-direction:column}.hall h3{font-size:21px;line-height:1.35;margin:6px 0}.hall p{font-size:var(--small);color:var(--muted)}.hall button{margin-top:auto;align-self:flex-start}.people{display:grid;grid-template-columns:repeat(3,1fr);gap:13px}.person-card{border:1px solid var(--line);border-left:7px solid #9aa5ad;background:var(--paper);border-radius:20px;padding:16px;text-align:left;display:grid;grid-template-columns:72px 1fr;gap:14px;align-items:center;min-height:126px}.person-card.blue{border-left-color:var(--blue)}.person-card.purple{border-left-color:var(--purple)}.person-card.orange{border-left-color:var(--orange)}.person-card.gold{border-left-color:var(--gold)}.mini-portrait{width:68px;height:78px;border-radius:17px;background:var(--ink);color:#fff;display:grid;place-items:center;font:25px Georgia,serif}.person-card b{display:block;font-size:19px}.person-card small{display:block;color:var(--muted);font-size:var(--small)}.status{display:inline-block;margin-top:5px;padding:3px 8px;border-radius:999px;background:var(--bg);font-size:12px;font-weight:900}.owned{color:var(--green)}.locked{color:var(--muted)}.encounter{max-width:850px;margin:auto}.context-bar{display:flex;align-items:center;gap:12px;margin-bottom:14px}.context-bar .mini-portrait{width:58px;height:64px}.conversation{background:rgba(255,255,255,.6);border:1px solid var(--line);border-radius:24px;padding:22px;min-height:330px}.bubble{max-width:78%;padding:16px 18px;border-radius:19px;margin:12px 0}.ai{background:var(--paper);border:1px solid var(--line)}.user{margin-left:auto;background:#bde2fa}.source-card{margin-top:13px;border-left:5px solid var(--green);background:#eef8f3;border-radius:12px;padding:14px;font-size:var(--small)}.composer{display:flex;gap:10px;margin-top:15px;background:var(--paper);border:2px solid var(--line);border-radius:16px;padding:8px}.composer input{flex:1;border:0;background:transparent;padding:8px}.profile{display:grid;grid-template-columns:260px 1fr;gap:24px}.profile-side,.profile-main,.panel{background:var(--paper);border:1px solid var(--line);border-radius:24px;padding:22px}.profile-side .portrait{margin:auto}.profile h1{font-size:34px;margin:10px 0}.facts{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-top:18px}.fact{background:var(--bg);border-radius:14px;padding:14px}.fact h3{font-size:18px;margin:0}.fact p{font-size:var(--small);margin:4px 0;color:var(--muted)}.museum-top{display:grid;grid-template-columns:1.2fr 1fr;gap:14px}.progress{height:13px;background:var(--line);border-radius:999px;overflow:hidden;margin:14px 0}.progress i{display:block;height:100%;background:linear-gradient(90deg,var(--blue),var(--purple));border-radius:inherit}.group-list{display:grid;gap:10px}.group-row{background:var(--bg);border-radius:14px;padding:13px;display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center}.pack-layout{display:grid;grid-template-columns:1.25fr .95fr;gap:16px}.pack-cover{min-height:470px;border-radius:30px;padding:34px;color:#fff;display:flex;flex-direction:column;justify-content:flex-end;position:relative;overflow:hidden}.pack-cover:before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.06),rgba(5,15,25,.84))}.pack-cover.tang{background:#994623}.pack-cover.renaissance{background:#346451}.pack-cover.physics{background:#394889}.pack-cover>*{position:relative}.pack-cover h1{font-size:40px;line-height:1.2}.rules{display:grid;gap:12px}.rule{background:var(--paper);border:1px solid var(--line);border-radius:19px;padding:18px}.rule h3{font-size:20px;margin:0 0 8px}.rule p,.rule li{font-size:var(--small);color:var(--muted)}.odds{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}.odd{background:var(--bg);border-radius:9px;padding:8px 3px;text-align:center;font-size:12px}.odd b{display:block}.modal-bg,.search-bg{position:fixed;inset:0;z-index:60;background:rgba(10,25,39,.55);backdrop-filter:blur(6px);display:grid;place-items:center;padding:18px}.modal{width:min(560px,100%);max-height:calc(100vh - 36px);overflow:auto;background:var(--paper);border-radius:26px;padding:26px;box-shadow:0 35px 100px rgba(10,25,39,.38)}.modal h2{font-size:30px;margin:5px 0}.confirm-row{display:flex;justify-content:space-between;background:var(--bg);border-radius:13px;padding:13px;margin:10px 0}.reveal{text-align:center;background:radial-gradient(circle at center,#7959bc,#243760 70%);color:#fff}.reveal .person-card{width:min(350px,100%);margin:20px auto;color:var(--ink);text-align:left}.persistent-error{border-left:6px solid var(--accent);background:#fff1ee;border-radius:14px;padding:15px;margin:14px 0}.search-bg{place-items:start center;padding-top:76px}.search-modal{width:min(760px,100%);max-height:calc(100vh - 100px);overflow:auto;background:var(--bg);border-radius:26px;padding:22px}.search-head{display:flex;gap:10px;position:sticky;top:-22px;background:var(--bg);padding:3px 0 15px;z-index:2}.search-head input{flex:1;border:2px solid var(--line);border-radius:14px;padding:12px;background:var(--paper)}.result-label{font-weight:900;margin:18px 3px 6px}.toast{position:fixed;right:20px;bottom:20px;z-index:80;background:var(--ink);color:#fff;border-radius:13px;padding:13px 16px;font-size:var(--small);box-shadow:var(--shadow)}.hidden{display:none}.adult-extra{display:none}[data-theme=adult] .adult-extra{display:block}.dev-note{font-size:12px;color:var(--muted)}@media(max-width:820px){.main{padding:28px 14px 80px}.nav{display:none}.quick{width:48px}.quick input{display:none}.period-grid,.hall-grid,.people,.profile,.museum-top,.pack-layout,.facts{grid-template-columns:1fr}.stage{display:block;text-align:center}.stage .portrait{margin:auto}.today{grid-template-columns:1fr}.proto span{display:none}.period-card{min-height:310px}.search-bg{place-items:end center;padding:50px 0 0}.search-modal{height:calc(100vh - 50px);max-height:none;border-radius:26px 26px 0 0}.bubble{max-width:92%}}
body[data-reduced=true] *{scroll-behavior:auto!important;animation:none!important;transition:none!important}
</style>

<body data-theme="child"><div id="app"></div><div id="toast" class="toast hidden"></div>
<script>
const groups={
tang:{title:'盛唐与东亚交流',years:'618–907',place:'长安、洛阳、西域与东亚海路',mark:'唐',cls:'tang',question:'一个开放繁荣的帝国，为什么也会经历战争与巨大转折？',halls:['长安：诗人与世界城市','佛法东行与丝路旅行','安史之乱：盛世为何转折'],people:[['wuzetian','武则天','武','orange','时代人物'],['tangxuanzong','唐玄宗','玄','purple','核心人物'],['libai','李白','李','gold','典藏人物'],['dufu','杜甫','杜','orange','时代人物'],['wangwei','王维','王','blue','关键人物'],['xuanzang','玄奘','奘','purple','核心人物'],['jianzhen','鉴真','鉴','white','线索人物'],['yanzhenqing','颜真卿','颜','blue','关键人物'],['anlushan','安禄山','安','purple','核心人物'],['guoziyi','郭子仪','郭','blue','关键人物'],['yangguifei','杨贵妃','杨','white','线索人物'],['abenakamaro','阿倍仲麻吕','晁','white','线索人物']]},
renaissance:{title:'欧洲文艺复兴与早期科学革命',years:'约1450–1650',place:'意大利城邦与欧洲知识网络',mark:'艺',cls:'renaissance',question:'艺术、印刷和观察，怎样共同改变人们理解世界的方式？',halls:['佛罗伦萨：艺术为何需要赞助人','罗马工作坊：大师如何竞争','从日心说到望远镜'],people:[['davinci','达·芬奇','达','gold','典藏人物'],['michelangelo','米开朗琪罗','米','orange','时代人物'],['raphael','拉斐尔','拉','purple','核心人物'],['lorenzo','洛伦佐·美第奇','洛','blue','关键人物'],['isabella','伊莎贝拉·德斯特','伊','blue','关键人物'],['sofonisba','索福尼斯巴','索','white','线索人物'],['machiavelli','马基雅维利','马','purple','核心人物'],['gutenberg','古腾堡','古','white','线索人物'],['copernicus','哥白尼','哥','purple','核心人物'],['galileo','伽利略','伽','orange','时代人物'],['kepler','开普勒','开','blue','关键人物'],['vesalius','维萨里','维','white','线索人物']]},
physics:{title:'现代物理革命',years:'1895–1969',place:'欧洲、北美与跨大西洋科学共同体',mark:'Q',cls:'physics',question:'科学家如何重新理解自然，又怎样面对战争与社会责任？',halls:['索尔维会议：自然是概率的吗','原子内部：理论与实验','流亡、战争与科学责任'],people:[['planck','普朗克','P','purple','核心人物'],['curie','居里夫人','C','orange','时代人物'],['rutherford','卢瑟福','R','blue','关键人物'],['einstein','爱因斯坦','E','gold','典藏人物'],['bohr','尼尔斯·玻尔','B','orange','时代人物'],['meitner','莉泽·迈特纳','M','blue','关键人物'],['schrodinger','薛定谔','S','blue','关键人物'],['heisenberg','海森堡','H','purple','核心人物'],['pauli','泡利','Pa','white','线索人物'],['dirac','狄拉克','D','white','线索人物'],['oppenheimer','奥本海默','O','purple','核心人物'],['wujianxiong','吴健雄','W','white','线索人物']]}}
const allPeople=Object.values(groups).flatMap(g=>g.people.map(p=>({group:Object.keys(groups).find(k=>groups[k]===g),id:p[0],name:p[1],initial:p[2],tier:p[3],tierName:p[4]})));const initialOwned=['libai','wuzetian','davinci','raphael','einstein','bohr','curie','planck'];
const defaultState={route:'home',theme:'child',group:'physics',ownedIds:initialOwned,stars:60,freeEligible:false,freeUsed:false,expanded:false,selected:'einstein',evidenceSeen:false,encounterComplete:false,pendingReveal:null,overlay:null,reduced:false,shards:20};
function loadState(){try{return {...defaultState,...JSON.parse(localStorage.getItem('aim-v6-state')||'{}')}}catch{return {...defaultState}}}let st=loadState();function save(){try{localStorage.setItem('aim-v6-state',JSON.stringify({...st,overlay:null}))}catch{}}
const labels={home:'主页',explore:'探索历史',period:'历史时期馆',hall:'历史展厅',encounter:'人物相遇',person:'人物资料',museum:'我的博物馆',pack:'卡包详情',chat:'长期对话'};
function personById(id){return allPeople.find(p=>p.id===id)}function groupOf(id){return personById(id)?.group}function isOwned(id){return st.ownedIds.includes(id)}function ownedCount(k){return groups[k].people.filter(p=>isOwned(p[0])).length}function toast(t){const e=document.querySelector('#toast');e.textContent=t;e.classList.remove('hidden');setTimeout(()=>e.classList.add('hidden'),1800)}
function go(r){st.route=r;st.overlay=null;location.hash=r;save();render();scrollTo(0,0)}function pickGroup(k,r='period'){st.group=k;st.expanded=false;go(r)}function selectPerson(id,r='person'){st.selected=id;st.group=groupOf(id)||st.group;go(r)}function setTheme(){st.theme=st.theme==='child'?'adult':'child';save();render()}function resetDemo(){st={...defaultState,ownedIds:[...initialOwned]};save();go('home')}
function openSearch(){if(st.overlay)return;st.overlay='search';document.body.classList.add('lock');document.body.insertAdjacentHTML('beforeend',overlay());setTimeout(()=>document.querySelector('#floatingSearch')?.focus(),0)}function closeOverlay(){const direct=st.overlay==='search';st.overlay=null;document.body.classList.remove('lock');if(direct){document.querySelector('.search-bg')?.remove();return}render()}function show(x){st.overlay=x;render()}
function proto(){return `<div class="proto"><b>Stage 3 v6</b><select onchange="go(this.value)">${Object.entries(labels).map(([k,v])=>`<option value="${k}" ${st.route===k?'selected':''}>${v}</option>`).join('')}</select><button onclick="setTheme()">${st.theme==='child'?'切换成人模式':'切换儿童模式'}</button><button onclick="st.reduced=!st.reduced;save();render()">${st.reduced?'恢复标准动态':'减少动态'}</button><button onclick="resetDemo()">重置首次体验</button><select onchange="preview(this.value);this.value='' "><option value="">预览状态</option><option value="insufficient">积分不足</option><option value="failure">服务失败</option><option value="duplicate">重复卡</option></select><span>历史优先 · ID拥有状态 · 结果先持久化</span></div>`}
function nav(){return `<header class="top"><div class="brand">AI Museum</div><nav class="nav"><button class="${st.route==='home'?'on':''}" onclick="go('home')">主页</button><button class="${['explore','period','hall'].includes(st.route)?'on':''}" onclick="go('explore')">探索历史</button><button class="${['museum','pack'].includes(st.route)?'on':''}" onclick="go('museum')">我的博物馆</button></nav><label class="quick" onclick="openSearch()"><span>⌕</span><input placeholder="搜索人物或关系" readonly></label><button class="stars" onclick="toast('每一颗探索星都有学习来源')">✦ ${st.stars}</button><button class="avatar" aria-label="账户与设置">小宇</button></header>`}function shell(c){return `${proto()}<div class="shell">${nav()}<main class="main">${c}</main></div>${st.overlay&&st.overlay!=='search'?overlay():''}`}
function home(){return shell(`<section class="hero"><div class="eyebrow">好用 · 好玩 · 有教育意义</div><h1>${st.encounterComplete?'继续你的历史旅程':'今天想进入哪一段历史？'}</h1><p>${st.encounterComplete?'你已经完成第一次人物相遇，可以继续对话或开启人物卡。':'先走进历史场景，再与人物建立长期关系。'}</p></section>${st.encounterComplete?`<article class="stage"><div class="portrait">E</div><div><div class="eyebrow">继续上次探索 · 现代物理革命</div><h2>爱因斯坦与量子世界</h2><p>你已经查看过索尔维会议的一条史料依据。</p><div class="actions"><button class="primary" onclick="selectPerson('einstein','chat')">继续长期对话</button><button class="secondary" onclick="pickGroup('physics','period')">回到这个时期</button></div></div></article>`:`<article class="today"><div><div class="eyebrow">第一次探索</div><h3>选择一个历史时期，从推荐展厅开始</h3><p>完成一次人物相遇后，将获得20探索星和一次免费开包。</p></div><button class="primary" onclick="go('explore')">选择历史时期</button></article>`}<div class="actions" style="justify-content:center"><button class="secondary" onclick="go('museum')">打开我的博物馆 · ${st.ownedIds.length}/36</button></div>`)}
function explore(){return shell(`<section class="hero"><div class="eyebrow">第一步 · 选择历史时期</div><h1>你想走进哪一段历史？</h1><p>每个时期都有12位人物和至少3个有来源的历史展厅。</p></section><div class="period-grid">${Object.entries(groups).map(([k,g])=>`<button class="period-card ${g.cls}" data-mark="${g.mark}" onclick="pickGroup('${k}')"><span class="eyebrow" style="color:#fff">${g.years} · 已认识 ${ownedCount(k)}/12</span><h2>${g.title}</h2><p>${g.question}</p><span class="count">进入这个时期 →</span><span class="adult-extra">${g.place}</span></button>`).join('')}</div>`)}
function period(){const g=groups[st.group],shown=st.expanded?g.people:g.people.slice(0,3);return shell(`<section class="period-hero ${g.cls}" data-mark="${g.mark}"><div class="eyebrow" style="color:#fff">${g.years} · ${g.place}</div><h1>${g.title}</h1><p>${g.question}</p><div class="actions"><button class="primary" onclick="go('hall')">进入推荐展厅</button><button class="secondary" onclick="go('pack')">查看本时期卡包</button></div></section><div class="section-head"><div><div class="eyebrow">从一个真实场景开始</div><h2>三个历史展厅</h2></div><p>人物因共同事件和证据相连</p></div>${hallCards(g)}<div class="section-head"><div><div class="eyebrow">${st.expanded?'本时期完整名册':'推荐起始人物'}</div><h2>${st.expanded?'12位人物':'先认识这3位'}</h2></div><button class="secondary" onclick="st.expanded=!st.expanded;save();render()">${st.expanded?'收起名册':'查看全部12人'}</button></div>${peopleCards(shown)}`)}
function hallCards(g){return `<div class="hall-grid">${g.halls.map((h,i)=>`<article class="hall"><div class="eyebrow">展厅 ${i+1}</div><h3>${h}</h3><p>${i===0?'从一个核心问题认识人物之间的不同立场。':'沿时间、地点和正式关系继续探索。'}</p><button class="${i===0?'primary':'secondary'}" onclick="go('hall')">${i===0?'进入推荐展厅':'看看这个展厅'}</button></article>`).join('')}</div>`}
function peopleCards(list){return `<div class="people">${list.map(p=>personButton(p)).join('')}</div>`}function personButton(p){return `<button class="person-card ${p[3]}" onclick="selectPerson('${p[0]}')"><span class="mini-portrait">${p[2]}</span><span><b>${p[1]}</b><small>${p[4]} · ${groups[groupOf(p[0])].years}</small><span class="status ${isOwned(p[0])?'owned':'locked'}">${isOwned(p[0])?'✓ 已获得 · 可长期对话':'生平开放 · 长期对话待解锁'}</span></span></button>`}
function hall(){const g=groups[st.group],starter=g.people[0];return shell(`<section class="hero"><div class="eyebrow">${g.years} · ${g.place}</div><h1>${g.halls[0]}</h1><p>${g.question}</p></section><div class="hall-grid"><article class="hall"><div class="eyebrow">发生了什么</div><h3>从时间、地点和一条史料开始</h3><p>博物馆旁白会说明人物亲历、当时可知和后人评价的区别。</p></article><article class="hall"><div class="eyebrow">推荐人物</div><h3>${starter[1]}</h3><p>完成一次引导式相遇，不需要先获得人物卡。</p><button class="primary" onclick="selectPerson('${starter[0]}','encounter')">和${starter[1]}相遇</button></article><article class="hall"><div class="eyebrow">学习奖励</div><h3>史料依据 + 有效追问</h3><p>完成后获得20探索星，并开放首次免费开包。</p></article></div><div class="actions" style="justify-content:center"><button class="secondary" onclick="go('period')">返回时期馆</button></div>`)}
function encounter(){const p=personById(st.selected);return shell(`<section class="encounter"><header class="context-bar"><span class="mini-portrait">${p.initial}</span><div><div class="eyebrow">博物馆相遇 · 不要求已获得</div><b>${p.name}</b></div></header><main class="conversation"><div class="bubble ai">欢迎来到这段历史。你可以先问我：当时发生了什么，或者我为什么会做出某个选择。</div><div class="bubble user">你为什么会出现在这个历史展厅？</div><div class="bubble ai">这是一次受人物边界约束的示范回答。历史断言会绑定当前人物版本中的正式 Claim。${st.evidenceSeen?`<div class="source-card"><b>史料依据</b><br>来源标题、作者、年代和具体位置将在这里显示。人物第一人称与博物馆旁白严格分开。</div>`:''}</div><div class="actions"><button class="secondary" onclick="st.evidenceSeen=true;save();render()">${st.evidenceSeen?'✓ 已查看依据':'看看依据'}</button>${st.evidenceSeen&&!st.encounterComplete?`<button class="primary" onclick="completeEncounter()">完成相遇 · +20探索星</button>`:''}</div></main><form class="composer" onsubmit="event.preventDefault();toast('原型不会调用真实模型')"><input aria-label="向人物提问" placeholder="继续问一个问题……"><button class="primary">发送</button></form></section>`)}function completeEncounter(){if(!st.encounterComplete){st.encounterComplete=true;st.freeEligible=!st.freeUsed;st.stars+=20}save();go('pack')}
function person(){const p=personById(st.selected),g=groups[p.group];return shell(`<div class="profile"><aside class="profile-side"><div class="portrait">${p.initial}</div><h1>${p.name}</h1><p>${p.tierName} · ${g.title}</p><span class="status ${isOwned(p.id)?'owned':'locked'}">${isOwned(p.id)?'✓ 已获得':'基本资料开放'}</span><div class="actions">${isOwned(p.id)?`<button class="primary" onclick="go('chat')">继续长期对话</button>`:`<button class="primary" onclick="go('encounter')">完成博物馆相遇</button>`}<button class="secondary" onclick="go('hall')">查看相关历史</button></div></aside><main class="profile-main"><div class="eyebrow">公开人物资料</div><h2>基本生平不会被卡牌锁住</h2><p>这里展示有来源的身份、年代、主要活动和争议说明。未获得人物同样可以查看。</p><div class="facts"><article class="fact"><h3>关键关系</h3><p>展示2条正式 Relationship，并解释为什么相关。</p></article><article class="fact"><h3>史料来源</h3><p>展示来源标题、定位、许可和支持的 Claim。</p></article><article class="fact"><h3>所属展厅</h3><p>${g.halls[0]}</p></article><article class="fact adult-extra"><h3>人物包版本</h3><p>版本1.0 · 评测通过 · 来源可审计</p></article></div></main></div>`)}
function museum(){return shell(`<section class="hero"><div class="eyebrow">我的博物馆</div><h1>已认识 ${st.ownedIds.length} / 36 位人物</h1><p>卡牌解锁长期关系；公共历史知识始终开放。</p></section>${st.pendingReveal?`<article class="today"><div><div class="eyebrow">最近获得 · 结果已经保存</div><h3>${personById(st.pendingReveal).name}正在等待你</h3><p>即使刚才关闭了动画，这个人物仍然已经加入卡册。</p></div><button class="primary" onclick="st.selected=st.pendingReveal;st.pendingReveal=null;save();go('chat')">开始长期对话</button></article>`:''}<div class="museum-top"><article class="panel"><h2>${st.ownedIds.length}/36</h2><div class="progress"><i style="width:${st.ownedIds.length/36*100}%"></i></div><button class="primary" onclick="go('explore')">继续探索历史</button></article><article class="panel"><div class="group-list">${Object.entries(groups).map(([k,g])=>`<div class="group-row"><span>${g.title}</span><b>${ownedCount(k)}/12</b><button class="secondary" onclick="pickGroup('${k}','pack')">卡包</button></div>`).join('')}</div></article></div><div class="section-head"><h2>最近探索的人物</h2></div>${peopleCards(groups.physics.people.filter(p=>isOwned(p[0])).slice(0,3))}`)}
function pack(){const g=groups[st.group],free=st.freeEligible&&!st.freeUsed,cost=60;return shell(`<div class="pack-layout"><article class="pack-cover ${g.cls}"><div class="eyebrow" style="color:#fff">${g.years} · 12/12人物已发布</div><h1>${g.title}</h1><p>${free?'你完成了一次真实历史相遇，本次免费并保证获得未拥有人物。':'每次开启消耗60探索星，约对应3次有效学习事件。'}</p><div class="actions">${free?`<button class="primary" onclick="show('confirm')">免费开启第一次人物卡</button>`:st.stars>=cost?`<button class="primary" onclick="show('confirm')">用60探索星开启</button>`:`<button class="primary" onclick="show('insufficient')">还差${cost-st.stars}探索星</button>`}<button class="secondary" onclick="go('hall')">先看历史展厅</button></div></article><aside class="rules"><section class="rule"><h3>公开规则</h3><p>白3 · 蓝3 · 紫3 · 橙2 · 金1。卡级表示本时期中的策展深度，不评价人物价值。</p><div class="odds"><div class="odd"><b>白35%</b>线索</div><div class="odd"><b>蓝30%</b>关键</div><div class="odd"><b>紫20%</b>核心</div><div class="odd"><b>橙10%</b>时代</div><div class="odd"><b>金5%</b>典藏</div></div></section><section class="rule"><h3>保底与恢复</h3><p>结果会先保存再播放动画。关闭、刷新或断线不会改变人物，也不会重复扣分。</p></section><section class="rule"><h3>当前状态</h3><p>已认识 ${ownedCount(st.group)}/12 · 探索星 ${st.stars} · 史料碎片 ${st.shards}</p></section></aside></div><div class="section-head"><h2>本卡包12位人物</h2><p>所有人的基本资料都可以浏览</p></div>${peopleCards(g.people)}`)}
function chat(){const p=personById(st.selected);return shell(`<section class="encounter"><header class="context-bar"><span class="mini-portrait">${p.initial}</span><div><div class="eyebrow">唯一长期线程 · 已恢复历史</div><b>${p.name}</b></div><button class="secondary" style="margin-left:auto" onclick="go('person')">人物资料</button></header><main class="conversation"><div class="bubble ai">欢迎回来。这里是你与${p.name}的长期线程，不会因为抽卡或时期跳转创建副本。</div><div class="bubble user">继续我们之前的话题。</div><div class="bubble ai">正式版本会召回近期消息、情节摘要和这个人物专属的关系记忆，并使用已审核 Claim 回答。</div></main><form class="composer" onsubmit="event.preventDefault();toast('原型不会调用真实模型')"><input aria-label="继续长期对话" placeholder="继续对话……"><button class="primary">发送</button></form></section>`)}
function overlay(){if(st.overlay==='confirm'){const free=st.freeEligible&&!st.freeUsed;return `<div class="modal-bg" role="presentation" onclick="closeOverlay()"><section class="modal" role="dialog" aria-modal="true" aria-labelledby="confirmTitle" onclick="event.stopPropagation()"><div class="eyebrow">结果会先保存</div><h2 id="confirmTitle">${free?'使用首次免费开包':'确认开启人物卡'}</h2><p>${free?'保证获得一位尚未拥有的人物。':'本次消耗60探索星；概率、保底和重复补偿已经公开。'}</p><div class="confirm-row"><span>当前探索星</span><b>${st.stars} ✦</b></div><div class="confirm-row"><span>本次消耗</span><b>${free?'免费':'60 ✦'}</b></div><div class="actions"><button class="primary" onclick="draw()">确认开启</button><button class="secondary" onclick="closeOverlay()">先不打开</button></div></section></div>`}if(st.overlay==='reveal'){const p=personById(st.pendingReveal);return `<div class="modal-bg"><section class="modal reveal" role="dialog" aria-modal="true" aria-labelledby="revealTitle"><div class="eyebrow" style="color:#fff">结果已经保存 · 可安全关闭</div><h2 id="revealTitle">新人物加入你的博物馆</h2>${personButton(groups[p.group].people.find(x=>x[0]===p.id))}<div class="actions" style="justify-content:center"><button class="primary" onclick="ackReveal('chat')">开始长期对话</button><button class="secondary" onclick="ackReveal('hall')">先看相关历史</button><button class="quiet" style="color:#fff" onclick="closeOverlay()">稍后再看</button></div></section></div>`}if(st.overlay==='insufficient')return `<div class="modal-bg" onclick="closeOverlay()"><section class="modal" role="dialog" aria-modal="true" onclick="event.stopPropagation()"><h2>探索星还不够</h2><div class="persistent-error">还差${60-st.stars}探索星。完成一次有史料依据的人物探索即可获得20探索星。</div><div class="actions"><button class="primary" onclick="closeOverlay();go('hall')">去完成历史探索</button><button class="secondary" onclick="closeOverlay()">关闭</button></div></section></div>`;if(st.overlay==='failure')return `<div class="modal-bg" onclick="closeOverlay()"><section class="modal" role="dialog" aria-modal="true" onclick="event.stopPropagation()"><h2>这次没有扣除探索星</h2><div class="persistent-error">卡池服务暂时不可用。你的余额、保底和人物状态都没有改变。</div><button class="primary" onclick="closeOverlay()">稍后重试</button></section></div>`;if(st.overlay==='duplicate'){const p=personById(st.ownedIds[0]);return `<div class="modal-bg" onclick="closeOverlay()"><section class="modal" role="dialog" aria-modal="true" onclick="event.stopPropagation()"><h2>再次遇见${p.name}</h2><p>你已经拥有这位人物，本次转化为20个史料碎片。当前定向兑换进度：40/50。</p><button class="primary" onclick="closeOverlay()">收入史料碎片</button></section></div>`}if(st.overlay==='search')return `<div class="search-bg" onclick="closeOverlay()"><section class="search-modal" role="dialog" aria-modal="true" aria-label="搜索人物或关系" onclick="event.stopPropagation()"><header class="search-head"><input id="floatingSearch" value="爱因斯坦" aria-label="搜索人物或关系"><button class="secondary" onclick="closeOverlay()">关闭</button></header><div class="result-label">你搜索的人</div>${searchResult('einstein','姓名完全匹配')}<div class="result-label">与爱因斯坦相关的人</div>${searchResult('bohr','长期学术争论 · 共同参加索尔维会议')}${searchResult('oppenheimer','同在普林斯顿高等研究院')}</section></div>`;return ''}
function searchResult(id,reason){const p=personById(id),row=groups[p.group].people.find(x=>x[0]===id);return `<button class="person-card ${p.tier}" style="width:100%;margin-top:10px" onclick="closeOverlay();selectPerson('${id}')"><span class="mini-portrait">${p.initial}</span><span><b>${p.name}</b><small>${reason}</small><span class="status ${isOwned(id)?'owned':'locked'}">${isOwned(id)?'✓ 已获得 · 打开资料':'生平开放 · 长期对话待解锁'}</span></span></button>`}
function draw(){const free=st.freeEligible&&!st.freeUsed;if(!free&&st.stars<60){st.overlay='insufficient';render();return}const candidates=groups[st.group].people.filter(p=>!isOwned(p[0]));if(!candidates.length){closeOverlay();toast('这个时期已经全部收齐');return}const result=candidates[0][0];if(!free)st.stars-=60;else{st.freeUsed=true;st.freeEligible=false}st.ownedIds=[...new Set([...st.ownedIds,result])];st.pendingReveal=result;st.selected=result;st.overlay='reveal';save();render()}function ackReveal(route){const id=st.pendingReveal;if(id)st.selected=id;st.pendingReveal=null;st.overlay=null;save();go(route)}function preview(x){if(!x)return;if(x==='duplicate')st.overlay='duplicate';else st.overlay=x;render()}
function render(){document.body.dataset.theme=st.theme;document.body.dataset.reduced=String(st.reduced);document.querySelector('#app').innerHTML=(window[st.route]||home)()}window.addEventListener('keydown',e=>{if(e.key==='Escape'&&st.overlay)closeOverlay()});window.addEventListener('hashchange',()=>{const r=location.hash.slice(1);if(labels[r]){st.route=r;render()}});if(labels[location.hash.slice(1)])st.route=location.hash.slice(1);render();
</script>
</body>
</html>
