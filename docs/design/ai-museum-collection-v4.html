<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AI Museum · 人物卡册 v4</title>
<style>
:root{--bg:#eaf7ff;--paper:#fffdf7;--ink:#18304b;--muted:#64798e;--line:#d6e5ed;--blue:#64b7f6;--yellow:#ffd45a;--coral:#ff7d66;--green:#42b883;--purple:#8f73de;--orange:#e88c38;--gold:#bf8b18;--shadow:0 20px 60px rgba(32,67,94,.14)}[data-theme=adult]{--bg:#edf1f4;--paper:#fff;--ink:#1f2b38;--muted:#5f6c78;--line:#d8dee3;--blue:#8095a8;--yellow:#b69a67;--coral:#315f88;--green:#527d69;--purple:#756d88;--orange:#9b7048;--gold:#92762e;--shadow:0 15px 45px rgba(24,36,48,.11)}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,"PingFang SC","Microsoft YaHei",sans-serif;line-height:1.55}button,input{font:inherit;color:inherit}button{cursor:pointer}.proto{height:38px;background:#182331;color:#dbe4ec;padding:0 14px;display:flex;align-items:center;gap:9px;font-size:11px;position:sticky;top:0;z-index:30}.proto b{color:#fff}.proto select{background:#29394c;color:white;border:1px solid #42536a;border-radius:7px;padding:4px}.proto span{margin-left:auto}.shell{min-height:calc(100vh - 38px);background:radial-gradient(circle at 12% 12%,rgba(255,255,255,.75) 0 4px,transparent 5px) 0 0/72px 72px,var(--bg)}[data-theme=adult] .shell{background:linear-gradient(145deg,#edf1f4,#e4e9ed)}.top{height:68px;padding:0 5vw;display:flex;align-items:center;gap:20px;background:rgba(255,255,255,.78);backdrop-filter:blur(12px);border-bottom:1px solid var(--line);position:sticky;top:38px;z-index:20}.brand{font:800 19px Georgia,serif}.nav{display:flex;gap:5px}.nav button{border:0;background:transparent;padding:9px 11px;border-radius:10px;font-weight:800;font-size:12px}.nav .on{background:var(--paper)}.quick-search{margin-left:auto;width:min(220px,22vw);display:flex;align-items:center;gap:7px;background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:7px 10px}.quick-search input{width:100%;border:0;outline:0;background:transparent;font-size:10px}.stars{border:0;border-radius:999px;background:var(--yellow);padding:8px 11px;font-weight:900;font-size:11px;white-space:nowrap}.avatar{width:38px;height:38px;border:0;border-radius:50%;background:var(--coral);color:#fff;font-size:10px;font-weight:900}.main{max-width:1080px;margin:auto;padding:38px 25px 80px}.hero{text-align:center;padding:22px 12px}.hero h1{font-size:37px;line-height:1.12;margin:8px}.hero p{max-width:660px;margin:8px auto;color:var(--muted);font-size:12px}.eyebrow{font-size:10px;color:var(--muted);font-weight:900;letter-spacing:.1em;text-transform:uppercase}.primary,.secondary,.quiet{border:0;border-radius:12px;padding:10px 14px;font-size:11px;font-weight:900}.primary{background:var(--coral);color:#fff}.secondary{background:var(--paper);border:1px solid var(--line)}.quiet{background:transparent;color:var(--muted)}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.stage{max-width:790px;margin:15px auto;background:var(--paper);border:1px solid var(--line);border-radius:28px;padding:27px;box-shadow:var(--shadow);display:flex;align-items:center;gap:22px}.face{width:104px;height:104px;border-radius:50%;background:var(--ink);color:#fff;border:7px solid var(--yellow);display:grid;place-items:center;font:42px Georgia,serif;flex:none}.stage h2{font-size:24px;margin:4px 0}.stage p,.card p{font-size:11px;color:var(--muted)}.today{max-width:790px;margin:13px auto;display:grid;grid-template-columns:1fr auto;align-items:center;gap:15px;background:rgba(255,255,255,.7);border:1px solid var(--line);border-radius:18px;padding:17px}.today h3{font-size:14px;margin:2px}.today p{font-size:10px;color:var(--muted);margin:2px}.reward{font-weight:900;color:var(--green)}.museum-head{display:grid;grid-template-columns:1.4fr 1fr;gap:14px}.panel{background:var(--paper);border:1px solid var(--line);border-radius:22px;padding:20px}.panel h2,.panel h3{margin:4px 0}.progress{height:10px;background:var(--line);border-radius:999px;overflow:hidden;margin:13px 0}.progress i{display:block;height:100%;width:44%;background:linear-gradient(90deg,var(--blue),var(--purple));border-radius:inherit}.recent{display:flex;gap:9px;margin-top:13px}.mini{width:72px;height:98px;border-radius:11px;border:3px solid var(--blue);background:linear-gradient(145deg,var(--paper),rgba(100,183,246,.25));display:grid;place-items:center;text-align:center;font-size:9px;font-weight:900}.mini.purple{border-color:var(--purple)}.mini.gold{border-color:var(--gold)}.tabs{display:flex;gap:7px;justify-content:center;margin:20px 0}.tabs button{border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:8px 12px;font-size:10px}.tabs .on{background:var(--ink);color:#fff}.card-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:10px}.person-card{aspect-ratio:3/4.25;border-radius:16px;background:var(--paper);border:4px solid #d8d8d3;padding:10px;display:flex;flex-direction:column;justify-content:flex-end;position:relative;overflow:hidden;box-shadow:0 8px 20px rgba(30,50,70,.08)}.person-card:before{content:attr(data-initial);position:absolute;inset:13px 13px 42%;border-radius:50%;background:var(--ink);color:#fff;display:grid;place-items:center;font:28px Georgia,serif}.person-card b{font-size:11px}.person-card span{font-size:8px;color:var(--muted)}.person-card.blue{border-color:var(--blue)}.person-card.purple{border-color:var(--purple)}.person-card.orange{border-color:var(--orange)}.person-card.gold{border-color:var(--gold);background:linear-gradient(145deg,#fffdf7,#fff0b8)}.person-card.locked{filter:saturate(.25);opacity:.7}.person-card.locked:after{content:"尚未获得 · 可看生平";position:absolute;inset:auto 7px 7px;background:rgba(24,48,75,.88);color:#fff;border-radius:8px;padding:5px;text-align:center;font-size:7px}.pack-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.pack{min-height:260px;border-radius:25px;padding:22px;color:#fff;display:flex;flex-direction:column;justify-content:flex-end;position:relative;overflow:hidden;box-shadow:var(--shadow)}.pack:before{content:"";position:absolute;width:210px;height:210px;border-radius:50%;right:-60px;top:-60px;background:rgba(255,255,255,.16)}.pack.quantum{background:linear-gradient(145deg,#213b73,#7358b8)}.pack.tang{background:linear-gradient(145deg,#a84b36,#e5a747)}.pack.renaissance{background:linear-gradient(145deg,#315f54,#68a07a)}.pack>*{position:relative}.pack h2{font-size:22px;margin:3px 0}.pack p{font-size:10px;opacity:.83}.pack .secondary{align-self:flex-start}.pack-detail{display:grid;grid-template-columns:1.4fr .9fr;gap:15px}.pack-cover{min-height:430px;background:linear-gradient(145deg,#213b73,#7358b8);color:#fff;border-radius:28px;padding:28px;display:flex;flex-direction:column;justify-content:flex-end;position:relative;overflow:hidden}.pack-cover:after{content:"Q";position:absolute;right:30px;top:5px;font:220px Georgia,serif;opacity:.09}.pack-cover h1{font-size:38px;margin:5px 0}.pack-cover p{max-width:520px;font-size:11px;opacity:.82}.rules{display:grid;gap:12px}.rule{background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:16px}.rule h3{font-size:13px;margin:0 0 7px}.rule p,.rule li{font-size:9px;color:var(--muted)}.odds{display:grid;grid-template-columns:repeat(5,1fr);gap:5px}.odd{text-align:center;border-radius:9px;padding:7px 3px;background:var(--bg);font-size:8px}.odd b{display:block;font-size:10px}.modal-bg{position:fixed;inset:0;background:rgba(18,35,53,.48);backdrop-filter:blur(5px);z-index:50;display:grid;place-items:center;padding:18px}.modal{width:min(480px,100%);background:var(--paper);border-radius:24px;padding:24px;box-shadow:0 30px 90px rgba(18,35,53,.35)}.modal h2{margin:5px 0}.modal p{font-size:11px;color:var(--muted)}.confirm-row{display:flex;justify-content:space-between;background:var(--bg);border-radius:13px;padding:12px;margin:16px 0;font-size:11px}.reveal{width:min(780px,100%);min-height:520px;color:#fff;text-align:center;border-radius:30px;background:radial-gradient(circle at center,#a98de9,#253964 65%);padding:35px;display:grid;place-items:center;position:relative;overflow:hidden}.reveal .skip{position:absolute;right:18px;top:18px}.big-card{width:220px;aspect-ratio:3/4.25;border:8px solid #b9a1ff;border-radius:24px;background:linear-gradient(145deg,#fff,#e7ddff);color:var(--ink);padding:18px;display:flex;flex-direction:column;justify-content:flex-end;box-shadow:0 0 70px rgba(231,221,255,.65);transform:rotate(-2deg)}.big-card .portrait{flex:1;border-radius:50%;background:var(--ink);color:#fff;display:grid;place-items:center;font:80px Georgia,serif;margin-bottom:15px}.big-card h2{margin:0}.big-card p{font-size:9px;color:var(--muted)}.duplicate{background:radial-gradient(circle at center,#5f8e7c,#253d39 70%)}.search-overlay{position:fixed;inset:0;z-index:45;background:rgba(18,35,53,.38);backdrop-filter:blur(5px);display:grid;place-items:start center;padding:80px 18px}.search-box{width:min(700px,100%);background:var(--paper);border-radius:22px;padding:20px;box-shadow:var(--shadow)}.search-box header{display:flex;gap:8px}.search-box input{flex:1;border:2px solid var(--line);border-radius:13px;padding:12px}.result{display:flex;align-items:center;gap:12px;margin-top:12px;padding:12px;border:1px solid var(--line);border-radius:15px}.result .face{width:58px;height:58px;border-width:4px;font-size:22px}.result div{flex:1}.result h3{font-size:13px;margin:0}.result p{font-size:9px;color:var(--muted);margin:2px}.toast{position:fixed;right:18px;bottom:18px;z-index:80;background:var(--ink);color:#fff;border-radius:12px;padding:11px 14px;font-size:10px;box-shadow:var(--shadow)}.hidden{display:none}@media(max-width:780px){.main{padding:25px 14px}.nav{display:none}.quick-search{width:42px}.quick-search input{display:none}.museum-head,.pack-detail{grid-template-columns:1fr}.pack-grid{grid-template-columns:1fr}.card-grid{grid-template-columns:repeat(3,1fr)}.stage{display:block;text-align:center}.stage .face{margin:auto}.proto span{display:none}.pack-cover{min-height:330px}.search-overlay{place-items:end center;padding:50px 0 0}.search-box{height:calc(100vh - 50px);border-radius:24px 24px 0 0}}
</style>
<style>body.search-open{overflow:hidden}</style>
</head>
<body data-theme="child"><div id="app"></div><div id="toast" class="toast hidden"></div>
<script>
const st={route:'home',theme:'child',stars:120,owned:8,overlay:null};
const labels={home:'主页',museum:'我的博物馆',packs:'卡包馆',pack:'量子革命卡包'};
function toast(t){const e=document.querySelector('#toast');e.textContent=t;e.classList.remove('hidden');setTimeout(()=>e.classList.add('hidden'),1700)}
function go(route){st.route=route;st.overlay=null;location.hash=route;render();scrollTo(0,0)}
function setTheme(){st.theme=st.theme==='child'?'adult':'child';render();toast(st.theme==='child'?'儿童轻快模式':'成人经典模式')}
function show(x){st.overlay=x;if(x==='search'){document.body.classList.add('search-open');document.body.insertAdjacentHTML('beforeend',overlay());return}render()}
function closeOverlay(){const wasSearch=st.overlay==='search';st.overlay=null;if(wasSearch){document.body.classList.remove('search-open');document.querySelector('.search-overlay')?.remove();return}render()}
function proto(){return `<div class="proto"><b>Collection v4</b><select onchange="go(this.value)">${Object.entries(labels).map(([k,v])=>`<option value="${k}" ${st.route===k?'selected':''}>${v}</option>`).join('')}</select><button class="secondary" onclick="setTheme()">切换 child / adult</button><button class="secondary" onclick="show('duplicate')">预览重复卡</button><span>可点击设计原型 · 无真实扣分或抽取</span></div>`}
function nav(){return `<header class="top"><div class="brand">AI Museum</div><nav class="nav"><button class="${st.route==='home'?'on':''}" onclick="go('home')">主页</button><button onclick="toast('沿用 Navigation v3 的历史展厅')">探索历史</button><button class="${['museum','packs','pack'].includes(st.route)?'on':''}" onclick="go('museum')">我的博物馆</button></nav><label class="quick-search" onclick="show('search')"><span>⌕</span><input placeholder="搜索人物或关系" readonly></label><button class="stars" onclick="toast('探索星来自有意义的学习，不按在线时长发放')">✦ ${st.stars}</button><button class="avatar">小宇</button></header>`}
function shell(content){return `${proto()}<div class="shell">${nav()}<main class="main">${content}</main></div>${overlay()}`}
function home(){return shell(`<section class="hero"><div class="eyebrow">今天继续探索</div><h1>历史因为人物相连</h1></section><article class="stage"><div class="face">E</div><div><div class="eyebrow">继续上次对话</div><h2>爱因斯坦与量子世界</h2><p>上次聊到：为什么爱因斯坦不完全同意玻尔。</p><div class="actions"><button class="primary" onclick="toast('恢复爱因斯坦长期线程')">继续和我聊 →</button></div></div></article><article class="today"><div><div class="eyebrow">今天的探索 · 不限时</div><h3>找出爱因斯坦与玻尔争论的一个原因</h3><p>完成一次有效对话并查看一条史料依据。</p></div><div><div class="reward">+20 探索星</div><button class="quiet" onclick="toast('奖励依据：对话 + 来源查看；重复发送不计分')">为什么？</button></div></article><div class="actions" style="justify-content:center"><button class="secondary" onclick="go('museum')">打开我的人物卡册</button></div>`)}
function museum(){const cards=[['E','爱因斯坦','金','gold'],['B','玻尔','紫','purple'],['C','居里夫人','橙','orange'],['P','普朗克','蓝','blue'],['L','李白','紫','purple'],['D','杜甫','紫','purple'],['M','达·芬奇','金','gold'],['R','拉斐尔','蓝','blue'],['H','海森堡','尚未获得','locked'],['S','薛定谔','尚未获得','locked'],['W','武则天','尚未获得','locked'],['G','伽利略','尚未获得','locked']];return shell(`<section class="hero"><div class="eyebrow">我的博物馆</div><h1>你收集的不是排名，是历史入口</h1><p>人物卡解锁长期对话；所有人的基本生平与史料仍可浏览。</p></section><div class="museum-head"><article class="panel"><div class="eyebrow">人物卡册</div><h2>${st.owned} / 18 位人物</h2><div class="progress"><i style="width:${st.owned/18*100}%"></i></div><button class="primary" onclick="go('packs')">去卡包馆</button></article><article class="panel"><div class="eyebrow">最近获得</div><div class="recent"><div class="mini purple">玻尔<br>核心人物</div><div class="mini gold">达·芬奇<br>典藏人物</div><div class="mini">拉斐尔<br>关键人物</div></div></article></div><div class="tabs"><button class="on">全部</button><button>量子革命</button><button>盛唐长安</button><button>文艺复兴</button></div><div class="card-grid">${cards.map(c=>`<article class="person-card ${c[3]}" data-initial="${c[0]}" onclick="toast('${c[3]==='locked'?'可以浏览生平；获得后解锁长期对话':'打开人物长期线程'}')"><b>${c[1]}</b><span>${c[2]}</span></article>`).join('')}</div>`)}
function packs(){return shell(`<section class="hero"><div class="eyebrow">卡包馆</div><h1>选择你想进入的历史</h1><p>卡包按时代、地点和人物关系组织。探索星不能购买，也不会过期。</p></section><div class="pack-grid"><article class="pack quantum"><div class="eyebrow" style="color:#dcd5ff">1900–1935 · 欧洲</div><h2>量子革命</h2><p>已收集 4 / 6 · 玻尔、海森堡、薛定谔等待发现</p><button class="secondary" onclick="go('pack')">查看卡包</button></article><article class="pack tang"><div class="eyebrow" style="color:#ffe3b8">618–907 · 中国</div><h2>盛唐长安</h2><p>已收集 2 / 6 · 诗歌、政治、宗教与东亚交流</p><button class="secondary" onclick="toast('打开盛唐卡包详情')">查看卡包</button></article><article class="pack renaissance"><div class="eyebrow" style="color:#d7ffdf">1400–1600 · 意大利</div><h2>文艺复兴</h2><p>已收集 2 / 6 · 艺术、城市、科学与赞助网络</p><button class="secondary" onclick="toast('打开文艺复兴卡包详情')">查看卡包</button></article></div>`)}
function pack(){return shell(`<div class="pack-detail"><article class="pack-cover"><div class="eyebrow" style="color:#dcd5ff">1900–1935 · 欧洲</div><h1>量子革命</h1><p>光和原子究竟如何运作？六位人物从理论、实验和哲学争论中给出不同回答。</p><div class="actions"><button class="primary" onclick="show('confirm')">用 100 探索星开启一次</button><button class="secondary" onclick="go('museum')">查看已收集人物</button></div></article><aside class="rules"><section class="rule"><h3>收集进度 · 4 / 6</h3><div class="progress"><i style="width:67%"></i></div><p>保底进度 5 / 10。达到 10 次时，保证获得本卡包尚未拥有的最高可用层级人物。</p></section><section class="rule"><h3>公开概率</h3><div class="odds"><div class="odd"><b>白 35%</b>线索</div><div class="odd"><b>蓝 30%</b>关键</div><div class="odd"><b>紫 20%</b>核心</div><div class="odd"><b>橙 10%</b>时代</div><div class="odd"><b>金 5%</b>典藏</div></div><p>层级表示本主题中的策展深度，不评价人物品格或绝对历史价值。</p></section><section class="rule"><h3>公平规则</h3><ul><li>探索星不能付费购买。</li><li>重复卡转为 20 个史料碎片。</li><li>动画随时可以跳过。</li><li>中断后恢复同一个结果，不重复扣分。</li></ul></section></aside></div>`)}
function overlay(){if(!st.overlay)return '';if(st.overlay==='confirm')return `<div class="modal-bg" onclick="closeOverlay()"><section class="modal" onclick="event.stopPropagation()"><div class="eyebrow">开启前确认</div><h2>量子革命卡包</h2><p>这次会随机获得一位人物。概率与保底已经公开，探索星无法付费购买。</p><div class="confirm-row"><span>当前余额</span><b>${st.stars} ✦</b></div><div class="confirm-row"><span>本次消耗</span><b>100 ✦</b></div><div class="actions"><button class="primary" onclick="draw(false)">确认开启</button><button class="secondary" onclick="closeOverlay()">先不打开</button></div></section></div>`;if(st.overlay==='reveal')return `<div class="modal-bg"><section class="reveal"><button class="secondary skip" onclick="claimCard()">跳过动画</button><div><div class="eyebrow" style="color:#eee">紫卡 · 核心人物</div><article class="big-card"><div class="portrait">S</div><h2>埃尔温·薛定谔</h2><p>1887–1961 · 波动力学 · 思想实验</p></article><h2>新人物加入你的博物馆！</h2><div class="actions" style="justify-content:center"><button class="primary" onclick="claimCard()">收入卡册</button></div></div></section></div>`;if(st.overlay==='duplicate')return `<div class="modal-bg"><section class="reveal duplicate"><button class="secondary skip" onclick="closeOverlay()">关闭</button><div><div class="eyebrow" style="color:#dff">重复人物</div><article class="big-card"><div class="portrait">B</div><h2>尼尔斯·玻尔</h2><p>已拥有 · 不会消失</p></article><h2>转化为 20 个史料碎片</h2><p>再收集 30 个，可以定向邀请一位尚未拥有的人物。</p></div></section></div>`;if(st.overlay==='search')return `<div class="search-overlay" onclick="closeOverlay()"><section class="search-box" onclick="event.stopPropagation()"><header><input value="爱因斯坦" aria-label="搜索人物或关系"><button class="secondary" onclick="closeOverlay()">关闭</button></header><article class="result"><div class="face">E</div><div><h3>爱因斯坦 · 已拥有</h3><p>可以继续长期对话</p></div><button class="primary">打开</button></article><article class="result"><div class="face" style="border-color:var(--purple)">B</div><div><h3>玻尔 · 已拥有</h3><p>与爱因斯坦长期学术争论</p></div><button class="secondary">查看关系</button></article><article class="result"><div class="face" style="border-color:var(--blue)">O</div><div><h3>奥本海默 · 尚未获得</h3><p>基本生平可浏览；长期对话待解锁</p></div><button class="secondary">看生平</button></article></section></div>`;return ''}
function draw(duplicate){if(st.stars<100){closeOverlay();toast('还差 '+(100-st.stars)+' 探索星；可以完成一个历史探索');return}st.stars-=100;st.overlay=duplicate?'duplicate':'reveal';render()}
function claimCard(){st.overlay=null;st.owned+=1;go('museum');toast('薛定谔已加入人物卡册')}
function render(){document.body.dataset.theme=st.theme;document.querySelector('#app').innerHTML=(window[st.route]||home)()}
window.addEventListener('keydown',e=>{if(e.key==='Escape'&&st.overlay)closeOverlay()});window.addEventListener('hashchange',()=>{const r=location.hash.slice(1);if(labels[r]){st.route=r;render()}});if(labels[location.hash.slice(1)])st.route=location.hash.slice(1);render();
</script>
</body>
</html>
