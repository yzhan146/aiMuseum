    function bottomNav(active){return `<nav class="bottom-nav"><button onclick="go('home')">${active==='home'?'●':'○'} 主页</button><button onclick="go('explore')">${active==='explore'?'●':'○'} 探索</button><button onclick="go('me')">${active==='me'?'●':'○'} 我的</button></nav>`}
    function shell(content,active=''){return globalHeader(active)+content+bottomNav(active)}
    function loginView(){return `<section class="auth-page"><div class="auth-art"><img src="${image('tang-changan-hall-vignette-v1.png')}" alt=""><img src="${image('renaissance-observation-hall-vignette-v1.png')}" alt=""><img src="${image('physics-atom-hall-vignette-v1.png')}" alt=""><div class="auth-copy"><span class="eyebrow" style="color:#ffdd8f">AI MUSEUM</span><h1>走进历史，<br>和过去的人相遇。</h1><p>你的对话、人物收藏和学习进度会保存在自己的博物馆里。</p></div></div><div class="auth-panel"><form class="auth-box" onsubmit="event.preventDefault();go('mode')"><span class="eyebrow">欢迎回来</span><h2>登录 AI Museum</h2><p class="lead" style="font-size:15px">登录后继续上次的展厅和人物对话。</p><div class="field"><label for="email">邮箱</label><input id="email" type="email" value="visitor@example.com" required></div><div class="field"><label for="password">密码</label><input id="password" type="password" value="Museum-demo1!" required></div><button class="primary">登录并继续</button><div class="auth-links"><button type="button" onclick="notice('打开独立注册页：邮箱、昵称和密码')">创建账户</button><button type="button" onclick="notice('打开独立重置密码页，并发送一次性邮件链接')">忘记密码？</button></div><div class="trust">🔒 登录、注册和密码重置是相互独立的页面。验证完成后会回到用户刚才的访问位置。</div></form></div></section>`}
    function modeView(){return `<section class="mode-page"><header class="mode-head"><span class="eyebrow">只改变视觉，不改变功能</span><h1>选择你喜欢的博物馆样子</h1><p class="lead">随时可以在账户菜单中切换；所有人物、历史内容和学习进度完全相同。</p></header><div class="mode-grid"><button class="mode-card ${state.mode==='child'?'selected':''}" onclick="state.mode='child';render()"><div class="mode-preview"><img src="${image('child-mode-preview-v1.webp')}" alt="两位小访客沿着彩色路线探索诗笺、城门模型和望远镜"><span>轻快版</span></div><h2>明亮、清楚、有探索感</h2><p>更大的点击区域、更活泼的色彩和清楚的任务提示。</p></button><button class="mode-card ${state.mode==='archive'?'selected':''}" onclick="state.mode='archive';render()"><div class="mode-preview"><img src="${image('renaissance-florence-hall-vignette-v1.png')}" alt="文艺复兴时期的典藏式历史场景重建"><span>典藏版</span></div><h2>克制、沉稳、有档案感</h2><p>更安静的材质与排版，适合偏好传统博物馆氛围的访客。</p></button></div><div class="mode-go"><button class="primary" onclick="document.body.dataset.mode=state.mode;go('home')">使用${state.mode==='child'?'轻快版':'典藏版'}进入主页</button></div></section>`}
    function periodCards(){return Object.values(periods).map(p=>`<button class="period-card" onclick="go('period',{periodId:'${p.id}'})"><img src="${image(p.image)}" alt=""><div><small>${p.years} · ${p.place}</small><h3>${p.title}</h3><p>${p.question}</p></div></button>`).join('')}
    function homeView(){return shell(`<main class="page"><section class="home-hero card"><div class="home-copy"><span class="eyebrow">继续上次探索</span><h1>爱因斯坦还记得<br>你们谈过玻尔。</h1><p>回到长期对话，或者沿着“流亡、战争与科学责任”继续寻找历史证据。</p><div class="resume-person"><img src="${portrait('albert-einstein')}" alt=""><div><b>阿尔伯特·爱因斯坦</b><small>上次对话 · 12 分钟前</small></div></div><div class="actions"><button class="primary" onclick="go('chat',{personId:'albert-einstein',hallId:'physics-responsibility'})">继续对话</button><button class="secondary" onclick="go('hall',{hallId:'physics-responsibility',station:1})">返回展厅</button></div></div><div class="home-art"><img src="${image('physics-responsibility-hall-vignette-v1.png')}" alt=""><div class="home-label"><span class="tag dark">历史主题艺术重建</span><b>流亡、战争与科学责任</b><span>从信件与迁徙进入科学家的选择</span></div></div></section><header class="section-head"><div><span class="eyebrow">从一段历史开始</span><h2>今天想走进哪个时期？</h2></div><button class="secondary" onclick="go('explore')">查看全部 9 个展厅</button></header><div class="period-strip">${periodCards()}</div><section class="quick-row"><article class="quick-card card"><span class="eyebrow">知道想找谁？</span><h3>搜索人物，也能找到与他相关的人</h3><p>精确结果先显示本人，再展示有正式关系线索的人物和共同展厅。</p><button class="secondary" onclick="openOverlay('search')">打开关系搜索</button></article><article class="quick-card card"><span class="eyebrow">我的博物馆</span><h3>6 位人物 · 3 条历史发现</h3><p>查看收藏、长期对话、学习主题和人物记忆。</p><button class="secondary" onclick="go('me')">查看我的博物馆</button></article></section></main>`,'home')}
    function hallCards(list=halls){return list.map(h=>`<button class="hall-card" onclick="go('hall',{hallId:'${h.id}',periodId:'${h.period}',station:1})"><img src="${image(h.image)}" alt=""><div class="hall-card-body"><span class="tag">${h.years}</span><h3>${h.title}</h3><p>${h.question}</p><footer><span>核心物件：${h.object}</span><span>进入展厅 →</span></footer></div></button>`).join('')}
    function exploreView(){const description=state.exploreView==='coordinate'?'按照时间与地点进入九个已开放展厅。':state.exploreView==='relation'?'从争论、合作、师生和共同事件进入历史语境。':'从一个可以追问的问题出发，而不是从抽象学科标签出发。';return shell(`<main class="page"><div class="explore-head"><div><span class="eyebrow">探索历史</span><h1 class="page-title">不是找一张人物卡，<br>而是进入一段关系。</h1><p class="lead">${description}</p></div><div class="view-tabs"><button class="${state.exploreView==='coordinate'?'on':''}" onclick="state.exploreView='coordinate';render()">历史坐标</button><button class="${state.exploreView==='relation'?'on':''}" onclick="state.exploreView='relation';render()">人物关系</button><button class="${state.exploreView==='theme'?'on':''}" onclick="state.exploreView='theme';render()">事件与问题</button></div></div><div class="era-rail"><button class="on" onclick="notice('当前展示全部已开放坐标')">全部开放时期</button><button onclick="go('period',{periodId:'tang'})">618–907 · 中国与东亚</button><button onclick="go('period',{periodId:'renaissance'})">1400–1650 · 欧洲</button><button onclick="go('period',{periodId:'physics'})">1895–1960s · 欧美</button></div><div class="hall-grid">${hallCards()}</div></main>`,'explore')}
    function periodView(){const p=periods[state.periodId]||periods.physics;const list=halls.filter(h=>h.period===p.id);return shell(`<main class="page"><div class="breadcrumb"><button onclick="go('home')">主页</button><span>›</span><button onclick="go('explore')">探索历史</button><span>›</span><b>${p.title}</b></div><section class="period-hero"><img src="${image(p.image)}" alt=""><div class="period-hero-content"><span class="tag dark">时期馆 · 3 个展厅</span><h1>${p.title}</h1><p>${p.years} · ${p.place}<br>${p.question}</p><div class="period-summary"><div><b>3</b><span>策展展厅</span></div><div><b>12</b><span>可认识人物</span></div><div><b>4</b><span>每厅参观站点</span></div></div></div></section><header class="section-head"><div><span class="eyebrow">选择一扇门</span><h2>同一个时期，也可以有完全不同的入口</h2></div><button class="secondary" onclick="go('explore')">返回全部时期</button></header><div class="hall-grid">${hallCards(list)}</div></main>`,'explore')}
    function personTile(id){const p=people[id];return `<button class="person-tile" onclick="go('person',{personId:'${id}'})"><img src="${portrait(id)}" alt=""><b>${p.name}</b><span>${p.role}</span></button>`}
    function stationView(h){if(state.station===1)return `<div><span class="eyebrow">第 1/4 站 · 入口</span><h2>先理解这里的问题，再走近物件</h2><p>环境图负责建立时代与空间感；真正需要阅读的标题、问题和展签始终保持为网页文字。</p><button class="primary" onclick="state.station=2;render();document.querySelector('.station').scrollIntoView()">前往核心物件</button></div>`;if(state.station===2)return `<div><span class="eyebrow">第 2/4 站 · 核心物件</span><h2>先看一件东西，再认识这里的人</h2><div class="station-grid"><article class="object-card"><div class="object-glyph">${h.glyph}</div><div><span class="tag">历史主题艺术重建</span><h3>${h.object}</h3><p>这件物件是理解“${h.question}”的入口。图像不作为史料证据，正式解释需要绑定来源与 Claim。</p><button class="secondary" onclick="openOverlay('artifact')">打开完整展签</button></div></article><div class="reflection"><span class="eyebrow">下一步</span><blockquote>一件物件为什么会把不同人物带到一起？</blockquote><button class="primary" onclick="state.station=3;render();document.querySelector('.station').scrollIntoView()">认识相关人物</button></div></div></div>`;if(state.station===3)return `<div><span class="eyebrow">第 3/4 站 · 人物关系</span><h2>这些人为什么会出现在同一个展厅？</h2><p>每个人物都有明确的事件、作品、合作或争论关系，而不是因为平台“有这个角色”就被放在一起。</p><div class="people-row">${h.people.map(personTile).join('')}</div><div class="actions" style="margin-top:18px"><button class="secondary" onclick="go('map')">查看关系与时间</button><button class="primary" onclick="state.station=4;render();document.querySelector('.station').scrollIntoView()">带走一个问题</button></div></div>`;return `<div><span class="eyebrow">第 4/4 站 · 离场</span><h2>这次参观不以“答对”结束</h2><div class="reflection"><span class="tag warm">带走的问题</span><blockquote>${h.reflection}</blockquote><p>你可以把问题带去见人物，也可以去同一时期的下一座展厅寻找另一种解释。</p><div class="actions"><button class="primary" onclick="go('person',{personId:'${h.people[0]}'})">带着问题去见${people[h.people[0]].name}</button><button class="secondary" onclick="go('period',{periodId:'${h.period}'})">返回时期馆</button></div></div></div>`}
    function hallView(){const h=hall();const p=periods[h.period];return shell(`<main><section class="immersive" style="--hall:${h.colors[0]};--hall-soft:${h.colors[1]};--hall-accent:${h.colors[2]}"><header class="hall-topline"><button onclick="go('period',{periodId:'${h.period}'})">← 返回「${p.title}」</button><span class="grow"></span><button onclick="go('map')">关系与时间</button><button onclick="openOverlay('search')">搜索人物</button></header><div class="hall-layout"><article class="hall-plaque"><small>${h.years}</small><h1>${h.title}</h1><p class="question">${h.question}</p><div class="actions"><button class="primary" onclick="state.station=Math.max(2,state.station);render();document.querySelector('.station').scrollIntoView()">开始参观</button><button class="quiet" style="color:#fff" onclick="openOverlay('artifact')">先看展签</button></div></article><div class="hall-visual"><img src="${image(h.image)}" alt=""><aside class="artifact-label"><small>核心物件</small><b>${h.object}</b><span>点击展签查看性质、意义和来源要求</span></aside><span class="tag dark rebuild-label">历史主题艺术重建</span></div></div><nav class="hall-route" aria-label="展厅站点">${['入口','核心物件','人物关系','离场问题'].map((x,i)=>`<button class="${state.station===i+1?'on':''}" onclick="state.station=${i+1};render();document.querySelector('.station').scrollIntoView()"><b>0${i+1}</b>${x}</button>`).join('')}</nav></section><section class="station card">${stationView(h)}</section></main>`,'explore')}
    function personView(){const p=person();const h=hall();return shell(`<main class="page"><div class="breadcrumb"><button onclick="go('hall')">${h.title}</button><span>›</span><b>${p.name}</b></div><section class="person-page"><aside class="person-profile card"><img class="person-portrait" src="${portrait(state.personId)}" alt=""><h1>${p.name}</h1><p>${p.years} · ${p.role}</p><span class="tag">${state.mode==='child'?'二次元形象':'典藏重建形象'} · 可切换</span><div class="actions" style="margin-top:18px"><button class="primary" onclick="go('chat')">开始长期对话</button><button class="secondary" onclick="setMode(state.mode==='child'?'archive':'child')">翻转头像</button></div></aside><article class="profile-body card"><span class="eyebrow">公开人物资料</span><h2>先认识这个人，再决定从哪里开始聊</h2><p class="profile-intro">${p.summary} 人物回答会以其时代、经历和认知边界为约束；博物馆旁白会把人物本人不知道的后世评价分开说明。</p><div class="profile-sections"><section class="profile-section"><h3>生平线索</h3><p>从出生、教育、旅行、职业和关键转折理解人物，而不是只记一个标签。</p></section><section class="profile-section"><h3>时代影响</h3><p>人物与作品如何影响同时代人，以及后世如何重新解释这些影响。</p></section><section class="profile-section"><h3>作品与言论</h3><p>正式条目需绑定作品版本、书信、档案或可靠公开来源。</p></section><section class="profile-section"><h3>认识的人</h3><p>${h.people.filter(x=>x!==state.personId).map(x=>people[x].name).join('、')||'关系资料正在整理'}等人物与其共享当前历史语境。</p></section></div><blockquote class="quote">可以先问：“你当时最担心什么？”或者“你和${people[h.people.find(x=>x!==state.personId)]?.name||'同时代人'}是怎样认识的？”</blockquote><div class="actions"><button class="primary" onclick="go('chat')">拿这个问题去聊</button><button class="secondary" onclick="go('map')">看他与谁相连</button><button class="quiet" onclick="go('hall')">返回展厅</button></div></article></section></main>`,'explore')}
    function chatView(){const p=person(),h=hall();return shell(`<main class="chat-page"><div class="chat-context"><button class="context-chip" onclick="go('hall')">← 回到「${h.title}」第 ${state.station}/4 站</button><button class="context-chip" onclick="go('map')">看看这些人怎么相连</button><div class="font-switch" aria-label="字体大小"><button class="${state.font==='small'?'on':''}" onclick="state.font='small';render()">小</button><button class="${state.font==='medium'?'on':''}" onclick="state.font='medium';render()">中</button><button class="${state.font==='large'?'on':''}" onclick="state.font='large';render()">大</button></div></div><div class="chat-layout"><section class="chat-shell card"><header class="chat-head"><img src="${portrait(state.personId)}" alt=""><div><b>${p.name}</b><span>长期线程 · 已恢复历史 · 人物私聊不会分享给其他人物</span></div><button class="quiet" style="margin-left:auto" onclick="openOverlay('search')">换人物</button></header><div class="messages" id="messages" style="font-size:${state.font==='small'?'14px':state.font==='large'?'19px':'16px'}">${state.messages.map(m=>`<div class="message-row ${m.role}">${m.role==='character'?`<img class="message-avatar" src="${portrait(state.personId)}" alt="">`:''}<article class="bubble"><span>${esc(m.text)}</span>${m.role==='character'?'<small>人物回答 · 可查看史料依据</small>':''}</article>${m.role==='user'?'<span class="message-avatar" style="display:grid;place-items:center;background:#1c4c70;color:#fff">我</span>':''}</div>`).join('')}</div><form class="chat-composer" onsubmit="sendMessage(event)"><input id="chatInput" aria-label="输入对话" placeholder="继续对话，例如：你认识玻尔吗？"><button class="primary">发送</button></form></section><aside class="clue-panel card"><span class="eyebrow">从对话中发现宝藏</span><h2>历史发现</h2>${state.clues.length?state.clues.map(c=>`<article class="clue-card"><small>✦ ${c.kind}</small><b>${c.title}</b><p>${c.detail}</p></article>`).join(''):'<div class="clue-empty">聊到代表作品、名句、关键关系或历史事件时，带来源的发现会出现在这里。</div>'}<div class="actions" style="margin-top:15px"><button class="secondary" onclick="openOverlay('sources')">看看依据</button></div><p style="font-size:12px;color:var(--muted);line-height:1.5">不记录普通寒暄；所有历史发现仍需绑定来源或公开 Claim。</p></aside></div></main>`,'')}
    function sendMessage(event){event.preventDefault();const input=$('chatInput');const value=input.value.trim();if(!value)return;state.messages.push({role:'user',text:value});state.messages.push({role:'character',text:'你问到了一个很重要的连接。以我所处的时代来说，我只能从亲历、通信和当时已经公开的知识谈起；后来的评价应该交给博物馆旁白说明。'});if(!state.clues.some(x=>x.title==='时代认知边界'))state.clues.push({kind:'对话线索',title:'时代认知边界',detail:'人物会区分亲历知识、同时代公开信息与后世评价。'});render();setTimeout(()=>{const box=$('messages');if(box)box.scrollTop=box.scrollHeight},0)}
    function mapView(){const h=hall(),names=h.people.map(id=>people[id]);return shell(`<main class="page"><div class="breadcrumb"><button onclick="go('hall')">${h.title}</button><span>›</span><b>关系与时间</b></div><div class="explore-head"><div><span class="eyebrow">上下文化知识图谱</span><h1 class="page-title">一张小图，只回答<br>当前展厅的问题。</h1></div><div class="view-tabs"><button class="${state.mapView==='relation'?'on':''}" onclick="state.mapView='relation';render()">人物关系</button><button class="${state.mapView==='timeline'?'on':''}" onclick="state.mapView='timeline';render()">历史时间</button></div></div><section class="map-layout ${state.mapView==='timeline'?'timeline':''}"><div class="network"><button class="node center" onclick="go('hall')">${h.object}</button><button class="node n1" onclick="go('person',{personId:'${h.people[0]}'})">${names[0].name}</button><button class="node n2" onclick="go('person',{personId:'${h.people[1]}'})">${names[1].name}</button><button class="node n3" onclick="go('person',{personId:'${h.people[2]}'})">${names[2].name}</button><button class="node n4" onclick="go('hall')">${h.title}</button></div><div class="timeline-list card"><article class="timeline-event"><time>入口</time><div><h3>${h.years}</h3><p>先确定人物何时、何地能够知道什么。</p></div></article><article class="timeline-event"><time>物件</time><div><h3>${h.object}</h3><p>通过物件连接制度、作品、实验或人的日常处境。</p></div></article><article class="timeline-event"><time>关系</time><div><h3>${names.map(x=>x.name).join('、')}</h3><p>人物关系必须由共同事件、作品、通信或公开记录支持。</p></div></article><article class="timeline-event"><time>离场</time><div><h3>${h.reflection}</h3><p>把开放问题带回人物对话，而不是把历史压成单一答案。</p></div></article></div><aside class="map-side card"><span class="eyebrow">当前选中</span><h2>${h.object}</h2><p style="color:var(--muted);line-height:1.6">它将三位人物放进同一个可以验证的历史问题中。</p>${names.map(x=>`<div class="relation-item"><b>${x.name}</b><span>${x.role}</span></div>`).join('')}<button class="primary" style="margin-top:16px" onclick="go('hall')">回到展厅第 ${state.station}/4 站</button></aside></section></main>`,'explore')}
    function meView(){return shell(`<main class="page"><span class="eyebrow">我的博物馆</span><h1 class="page-title">历史不会因为<br>关闭页面而消失。</h1><p class="lead">人物拥有彼此隔离的长期线程；学习进度可以调整讲解深度，但不会暴露来自哪一段私聊。</p><section class="me-grid"><article class="me-card card"><span class="eyebrow">最近遇见</span><h2>继续人物长期线程</h2><div class="recent-list">${['albert-einstein','li-bai','galileo'].map(id=>`<button class="recent-person" onclick="go('chat',{personId:'${id}',hallId:'${id==='li-bai'?'tang-changan':id==='galileo'?'renaissance-observation':'physics-responsibility'})"><img src="${portrait(id)}" alt=""><b>${people[id].name}</b><span>${id==='albert-einstein'?'12 分钟前':'2 天前'}</span></button>`).join('')}</div></article><article class="me-card card"><span class="eyebrow">学习地图</span><h2>科学家如何使用证据</h2><p>正在练习 · 最近从原子实验和索尔维会议获得新证据。</p><div class="progress"><i style="width:62%"></i></div><button class="secondary" onclick="go('period',{periodId:'physics'})">继续这个主题</button></article><article class="me-card card"><span class="eyebrow">我的收藏</span><h2>6 位人物 · 80 探索星</h2><p>人物卡、重复碎片和解锁记录按账户隔离。</p><div class="progress"><i style="width:50%"></i></div><button class="secondary" onclick="notice('进入人物卡册；抽卡不是本轮展厅主流程')">查看人物卡册</button></article><article class="me-card card"><span class="eyebrow">管理</span><h2>历史、记忆与隐私</h2><div class="menu-list"><button onclick="notice('打开按人物筛选的对话历史')">全部对话历史<span>搜索、分页和时间定位</span></button><button onclick="notice('打开记忆中心：查看、纠正、暂停或忘记')">人物记得什么<span>人物私聊记忆彼此隔离</span></button><button onclick="openOverlay('account')">设置与隐私<span>视觉模式、数据导出、账户安全</span></button></div></article></section></main>`,'me')}
    function flowView(){const lanes=[['进入',['login','mode','home']],['历史发现',['explore','period','hall']],['人物相遇',['person','chat','map']],['长期关系',['me']]];return `<main class="flow-page"><div class="flow-head"><div><span class="eyebrow">完整访客导航</span><h1>一条主路线，三条随时可用的短路。</h1></div><p>主路线通过历史语境进入人物；搜索服务于已知目标；对话能返回原展厅；“我的博物馆”负责恢复长期状态。点击任意节点直接检查页面。</p></div><div class="flow-lanes">${lanes.map(([name,ids])=>`<section class="flow-lane card"><strong>${name}</strong><div class="flow-nodes">${ids.map((id,i)=>`${i?'<span class="arrow">→</span>':''}<button class="flow-node" onclick="go('${id}')"><b>${reviewScreens.find(x=>x[0]===id)[1]}</b><span>${id==='hall'?'入口 → 物件 → 人物 → 离场':id==='chat'?'长期线程 + 历史发现':id==='me'?'历史、收藏、学习、记忆':'点击进入页面'}</span></button>`).join('')}</div></section>`).join('')}</div><section class="flow-note"><b>三条短路：</b> 顶部关系搜索可以从任何页面直接找到人物；人物对话可一键回到进入时的展厅与站点；头像菜单提供模式、隐私和独立维护者入口，但维护者功能不混进访客导航。</section></main>`}
    function render(){document.body.dataset.mode=state.mode;const views={flow:flowView,login:loginView,mode:modeView,home:homeView,explore:exploreView,period:periodView,hall:hallView,person:personView,chat:chatView,map:mapView,me:meView};$('app').innerHTML=(views[state.screen]||flowView)();$('reviewNav').innerHTML=reviewScreens.map(([id,label])=>`<button class="${state.screen===id?'on':''}" onclick="go('${id}')">${label}</button>`).join('');renderOverlay()}
    function searchOverlay(){const ids=['albert-einstein','niels-bohr','robert-oppenheimer'];return `<div class="overlay" onclick="if(event.target===this)closeOverlay()"><section class="modal" role="dialog" aria-modal="true" aria-label="搜索人物和关系"><header class="modal-head"><div><span class="eyebrow">悬浮搜索 · 不打断当前页面</span><h2>搜索人物、关系或展厅</h2></div><button class="close" onclick="closeOverlay()">×</button></header><input class="search-box" value="爱因斯坦" aria-label="搜索词"><span class="tag">你搜索的人</span>${ids.map((id,i)=>{const p=people[id];return `<article class="search-result"><img src="${portrait(id)}" alt=""><div><b>${p.name} · ${p.years}</b><p>${i===0?'姓名精确匹配':i===1?'长期量子理论争论 · 共同参加索尔维会议':'共同处于战争与科学责任主题'}</p></div><button class="secondary" onclick="closeOverlay();go('person',{personId:'${id}',hallId:'${i===1?'physics-solvay':'physics-responsibility'}'})">${i===0?'查看本人':'查看关系'}</button></article>`}).join('')}<div class="actions" style="margin-top:14px"><button class="quiet" onclick="closeOverlay();go('map',{hallId:'physics-solvay'})">查看完整关系网络 →</button></div></section></div>`}
    function artifactOverlay(){const h=hall();return `<div class="drawer-wrap" onclick="if(event.target===this)closeOverlay()"><aside class="drawer" role="dialog" aria-modal="true"><header class="modal-head"><div><span class="eyebrow">核心物件展签</span><h2>${h.object}</h2></div><button class="close" onclick="closeOverlay()">×</button></header><div class="label-block"><span class="tag">历史主题艺术重建</span><h3>${h.years}</h3><p>入口图片根据该时期的材料、工具和空间进行艺术重建，不对应或冒充某一件真实文物。</p></div><div class="label-block"><small>它见证了什么</small><h3>${h.question}</h3><p>物件把抽象时代问题落到可以观察、比较和追问的具体证据上。</p></div><div class="label-block"><small>我们凭什么知道</small><div class="source-box">正式版本需要绑定来源、许可、物件说明和人物关系 Claim。生成图片本身不作为历史依据。</div></div><button class="primary" onclick="closeOverlay();state.station=3;render()">认识与它相关的人物</button></aside></div>`}
    function sourcesOverlay(){return `<div class="drawer-wrap" onclick="if(event.target===this)closeOverlay()"><aside class="drawer" role="dialog" aria-modal="true"><header class="modal-head"><div><span class="eyebrow">当前回答的依据</span><h2>人物关系与时代边界</h2></div><button class="close" onclick="closeOverlay()">×</button></header><div class="label-block"><span class="tag">已审核 Claim</span><h3>爱因斯坦与玻尔的量子理论争论</h3><p>人物关系通过会议记录、通信、论文和公开回忆相互印证；同处一张合影并不自动证明观点关系。</p></div><div class="label-block"><small>来源位置</small><div class="source-box">公开会议记录 · 观点段落<br>人物书信索引 · 关系定位<br>来源间存在差异时并列展示，不强行合并。</div></div><button class="primary" onclick="closeOverlay()">看完了，回到对话</button></aside></div>`}
    function accountOverlay(){return `<aside class="account-menu" role="dialog" aria-label="账户菜单"><header><span>陈</span><div><b>陈小博</b><small>邮箱已验证 · 进度已同步</small></div><button class="close" style="margin-left:auto" onclick="closeOverlay()">×</button></header><button onclick="setMode(state.mode==='child'?'archive':'child');closeOverlay()">切换为${state.mode==='child'?'典藏版':'轻快版'}<small>只改变视觉，不改变功能</small></button><button onclick="notice('打开设置与隐私');closeOverlay()">设置、记忆与数据</button><button onclick="notice('访客端将在新页面打开独立维护者入口');closeOverlay()">维护者入口 ↗<small>独立产品界面，不属于访客导航</small></button><button onclick="go('login');closeOverlay()">退出登录</button></aside>`}
    function renderOverlay(){if(!state.overlay){$('overlayRoot').innerHTML='';return}const views={search:searchOverlay,artifact:artifactOverlay,sources:sourcesOverlay,account:accountOverlay};$('overlayRoot').innerHTML=(views[state.overlay]||(()=>''))()}
    window.addEventListener('hashchange',()=>{state.screen=location.hash.slice(1)||'flow';render();window.scrollTo(0,0)});document.addEventListener('keydown',e=>{if(e.key==='Escape')closeOverlay()});render();
  </script>
</body>
</html>
