<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI Museum · Navigation v3</title>
<style>
:root{--bg:#eaf7ff;--paper:#fffdf7;--ink:#18304b;--muted:#64798e;--blue:#64b7f6;--yellow:#ffd45a;--coral:#ff7d66;--green:#42b883;--lav:#a995f5;--line:#d6e5ed;--shadow:0 20px 60px rgba(32,67,94,.14)}[data-theme=adult]{--bg:#edf1f4;--paper:#fff;--ink:#1f2b38;--muted:#5f6c78;--blue:#8095a8;--yellow:#b69a67;--coral:#315f88;--green:#527d69;--lav:#7b718e;--line:#d8dee3;--shadow:0 15px 45px rgba(24,36,48,.11)}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,"PingFang SC","Microsoft YaHei",sans-serif;line-height:1.55}button,input{font:inherit;color:inherit}button{cursor:pointer}.proto{height:38px;background:#182331;color:#dbe4ec;padding:0 14px;display:flex;align-items:center;gap:10px;font-size:11px;position:sticky;top:0;z-index:20}.proto b{color:white}.proto select{background:#29394c;color:white;border:1px solid #42536a;border-radius:7px;padding:4px}.proto span{margin-left:auto}.shell{min-height:calc(100vh - 38px);background:radial-gradient(circle at 12% 12%,rgba(255,255,255,.8) 0 4px,transparent 5px) 0 0/72px 72px,var(--bg)}[data-theme=adult] .shell{background:linear-gradient(145deg,#edf1f4,#e4e9ed)}.top{height:68px;padding:0 5vw;display:flex;align-items:center;gap:24px;background:rgba(255,255,255,.74);backdrop-filter:blur(12px);border-bottom:1px solid var(--line);position:sticky;top:38px;z-index:15}.brand{font:800 19px Georgia,serif}.nav{display:flex;gap:6px}.nav button,.ghost{border:0;background:transparent;padding:9px 11px;border-radius:10px;font-weight:800;font-size:12px}.nav .on,.ghost:hover{background:var(--paper)}.avatar{margin-left:auto;width:38px;height:38px;border-radius:50%;border:0;background:var(--yellow);font-size:10px;font-weight:900}.main{max-width:1080px;margin:auto;padding:40px 25px 80px}.hero{text-align:center;padding:28px 15px}.eyebrow{font-size:11px;color:var(--muted);font-weight:900;letter-spacing:.1em;text-transform:uppercase}.hero h1{font-size:38px;line-height:1.12;margin:8px}.hero p{max-width:680px;color:var(--muted);margin:10px auto}.stage{max-width:790px;margin:18px auto;background:var(--paper);border:1px solid var(--line);border-radius:28px;padding:28px;box-shadow:var(--shadow);position:relative;overflow:hidden}.stage:after{content:"";position:absolute;width:220px;height:220px;border-radius:50%;background:var(--blue);opacity:.13;right:-80px;top:-100px}.person{position:relative;z-index:1;display:flex;align-items:center;gap:22px}.face{width:112px;height:112px;border-radius:50%;background:var(--ink);color:white;border:7px solid var(--yellow);display:grid;place-items:center;font:45px Georgia,serif;flex:none}.stage h2{font-size:25px;margin:4px 0}.stage p,.card p{font-size:11px;color:var(--muted)}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:15px}.primary,.secondary{border:0;border-radius:12px;padding:10px 14px;font-weight:900;font-size:11px}.primary{background:var(--coral);color:white}.secondary{background:var(--paper);border:1px solid var(--line)}.home-ways{max-width:790px;margin:14px auto;display:grid;grid-template-columns:1fr 1fr;gap:12px}.way{background:rgba(255,255,255,.7);border:1px solid var(--line);border-radius:18px;padding:18px;text-align:left}.way b{display:block;font-size:14px}.way span{font-size:10px;color:var(--muted)}.way button{margin-top:10px}.tabs{display:flex;justify-content:center;gap:7px;margin:16px 0}.tabs button{border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:8px 12px;font-size:11px}.tabs .on{background:var(--ink);color:white}.filters{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin:15px}.filters button{border:1px solid var(--line);background:rgba(255,255,255,.7);border-radius:10px;padding:7px 10px;font-size:10px}.filters .on{background:var(--yellow)}.halls{display:grid;grid-template-columns:1.5fr 1fr;gap:14px}.hall{background:var(--paper);border:1px solid var(--line);border-radius:22px;padding:21px;min-height:210px;position:relative;overflow:hidden}.hall.feature{background:linear-gradient(135deg,var(--paper),rgba(100,183,246,.25))}.hall h3{font-size:20px;margin:5px 0}.hall p{font-size:11px;color:var(--muted)}.people-dots{display:flex;margin:15px 0}.dotface{width:42px;height:42px;border-radius:50%;background:var(--ink);color:white;border:3px solid var(--paper);display:grid;place-items:center;font:15px Georgia,serif;margin-left:-6px}.dotface:first-child{margin-left:0}.hall-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:11px}.hall-grid .hall{min-height:160px}.coordinate{display:flex;gap:8px;align-items:center;justify-content:center;color:var(--muted);font-size:11px}.coordinate strong{color:var(--ink)}.question{font:22px Georgia,"Songti SC",serif;max-width:670px;margin:20px auto;text-align:center}.roles{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:20px}.role{background:var(--paper);border:1px solid var(--line);border-radius:17px;padding:14px;text-align:center}.role .face{width:72px;height:72px;font-size:27px;border-width:5px;margin:auto}.role h3{font-size:13px;margin:8px 0 3px}.role p{font-size:9px}.role.selected{outline:3px solid var(--yellow)}.search{max-width:720px;margin:20px auto}.search input{width:100%;border:2px solid var(--line);border-radius:15px;padding:14px 16px;background:var(--paper);font-size:14px}.result{display:flex;align-items:center;gap:14px;background:var(--paper);border:1px solid var(--line);border-radius:17px;padding:14px;margin-top:10px}.result .face{width:64px;height:64px;font-size:23px;border-width:4px}.result div:nth-child(2){flex:1}.result h3{font-size:14px;margin:0}.result p{font-size:10px;color:var(--muted);margin:3px 0}.chat{max-width:800px;margin:auto}.chat-head{display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--line);padding:12px}.chat-head .face{width:48px;height:48px;font-size:18px;border-width:3px}.chat-head .context{margin-left:auto;font-size:10px;color:var(--muted)}.messages{min-height:350px;padding:22px 8%}.bubble{max-width:80%;padding:13px 15px;border-radius:17px;margin:10px 0;font-size:12px}.user{margin-left:auto;background:var(--blue)}.ai{background:var(--paper);border:1px solid var(--line)}.inline{display:flex;gap:6px;margin-top:9px}.inline button{border:0;background:var(--bg);border-radius:8px;padding:6px 8px;font-size:9px}.composer{display:flex;gap:8px;background:var(--paper);border:2px solid var(--line);padding:8px;border-radius:15px}.composer input{flex:1;border:0;outline:0;background:transparent}.map{height:380px;border:1px solid var(--line);border-radius:24px;background:radial-gradient(circle at center,var(--paper),transparent);position:relative}.node{position:absolute;width:82px;height:82px;border-radius:50%;border:4px solid var(--blue);background:var(--paper);display:grid;place-items:center;font-size:10px;font-weight:900;text-align:center}.node.main{left:44%;top:38%;background:var(--ink);color:white;border-color:var(--yellow)}.node.a{left:15%;top:15%}.node.b{right:15%;top:15%}.node.c{left:18%;bottom:12%}.node.d{right:18%;bottom:10%}.me-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.card{background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:17px}.card h3{font-size:14px;margin:4px 0}.hidden{display:none}.toast{position:fixed;z-index:50;right:20px;bottom:20px;background:var(--ink);color:white;border-radius:11px;padding:11px 14px;font-size:10px;box-shadow:var(--shadow)}@media(max-width:760px){.main{padding:25px 14px}.nav{display:none}.halls,.hall-grid,.roles,.me-grid,.home-ways{grid-template-columns:1fr}.person{display:block;text-align:center}.face{margin:auto}.proto span{display:none}.roles .role{display:flex;align-items:center;text-align:left;gap:12px}.roles .role .face{margin:0}.map{height:480px}}
</style><style>
.quick-search{margin-left:auto;width:min(260px,24vw);display:flex;align-items:center;background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:7px 10px;gap:7px}.quick-search input{width:100%;border:0;outline:0;background:transparent;font-size:11px}.top .avatar{margin-left:0}.search>input{width:100%;border:2px solid var(--line);border-radius:15px;padding:14px 16px;background:var(--paper);font-size:14px}.result-group{margin-top:22px}.result-label{display:flex;align-items:center;justify-content:space-between;margin:0 2px 8px;font-size:11px;color:var(--muted)}.result-label b{font-size:13px;color:var(--ink)}.result.exact{border:2px solid var(--yellow);box-shadow:0 10px 30px rgba(32,67,94,.08)}.relation{display:inline-block;margin-top:5px;padding:4px 7px;border-radius:999px;background:var(--bg);color:var(--ink);font-size:9px;font-weight:800}.why{border:0;background:transparent;color:var(--muted);font-size:9px;text-decoration:underline}@media(max-width:760px){.quick-search{margin-left:auto;width:42px}.quick-search input{display:none}}
</style><style>
body.search-open{overflow:hidden}.search-overlay{position:fixed;inset:0;z-index:40;background:rgba(18,35,53,.38);backdrop-filter:blur(5px);display:grid;place-items:start center;padding:78px 18px 24px}.search-modal{width:min(760px,100%);max-height:calc(100vh - 100px);overflow:auto;background:var(--bg);border:1px solid rgba(255,255,255,.7);border-radius:26px;box-shadow:0 30px 90px rgba(18,35,53,.3);padding:22px}.search-modal-head{display:flex;align-items:center;gap:12px;position:sticky;top:-22px;z-index:2;background:var(--bg);padding:4px 0 14px}.search-modal-head label{flex:1;display:flex;align-items:center;gap:8px;background:var(--paper);border:2px solid var(--line);border-radius:15px;padding:11px 14px}.search-modal-head input{width:100%;border:0;outline:0;background:transparent;font-size:14px}.close-search{width:40px;height:40px;border:0;border-radius:50%;background:var(--paper);font-size:18px}.search-origin{font-size:10px;color:var(--muted);margin:0 2px 10px}@media(max-width:760px){.search-overlay{place-items:end center;padding:54px 0 0}.search-modal{max-height:calc(100vh - 54px);height:calc(100vh - 54px);border-radius:24px 24px 0 0;padding:16px}.search-modal-head{top:-16px}}
</style></head><body data-theme="child"><div id="app"></div><div id="toast" class="toast hidden"></div>
<script>
const st={route:'home',theme:'child',lens:'coordinate',selected:'einstein'};const labels={home:'主页',explore:'探索历史',hall:'历史展厅',search:'直接找人',person:'人物介绍',chat:'人物对话',map:'展厅关系与时间',me:'我的探索'};function go(r){st.route=r;location.hash=r;render();scrollTo(0,0)}function setTheme(t){st.theme=t;document.body.dataset.theme=t;render();toast(t==='child'?'轻快模式':'经典模式')}function toast(t){const e=document.querySelector('#toast');e.textContent=t;e.classList.remove('hidden');setTimeout(()=>e.classList.add('hidden'),1600)}function proto(){return `<div class="proto"><b>Navigation v3</b><select onchange="go(this.value)">${Object.entries(labels).map(x=>`<option value="${x[0]}" ${st.route===x[0]?'selected':''}>${x[1]}</option>`).join('')}</select><button class="secondary" onclick="setTheme(st.theme==='child'?'adult':'child')">切换 child / adult</button><span>可点击设计原型 · 无真实 API</span></div>`}function nav(){return `<header class="top"><div class="brand">AI Museum</div><nav class="nav"><button class="${st.route==='home'?'on':''}" onclick="go('home')">主页</button><button class="${['explore','hall','map'].includes(st.route)?'on':''}" onclick="go('explore')">探索历史</button><button class="${st.route==='me'?'on':''}" onclick="go('me')">我的探索</button></nav><button class="avatar" onclick="toast('模式 · 帮助 · 隐私')">小宇</button></header>`}function shell(c){return `${proto()}<div class="shell">${nav()}<main class="main">${c}</main></div>`}
function home(){return shell(`<section class="hero"><div class="eyebrow">下午好，小宇</div><h1>今天从哪里继续？</h1></section><article class="stage"><div class="person"><div class="face">E</div><div><div class="eyebrow">继续上次对话</div><h2>爱因斯坦与量子世界</h2><p>上次聊到：为什么爱因斯坦不完全同意玻尔。</p><div class="actions"><button class="primary" onclick="go('chat')">继续和我聊 →</button></div></div></div></article><div class="home-ways"><article class="way"><b>探索一段历史</b><span>从时间、地点、人物关系或一个问题开始。</span><br><button class="secondary" onclick="go('explore')">进入历史展厅</button></article><article class="way"><b>已经知道想找谁？</b><span>按姓名、时代、地点或主题直接寻找人物。</span><br><button class="secondary" onclick="go('search')">直接找人</button></article></div>`)}
function explore(){const views={coordinate:`<div class="filters"><button class="on">1920–1930</button><button>1400–1550</button><button>600–900</button><button>更多年代</button></div><div class="coordinate"><strong>欧洲</strong><span>·</span><span>布鲁塞尔 / 哥本哈根 / 柏林</span></div>`,relationship:`<div class="filters"><button class="on">对手与争论</button><button>家族与王朝</button><button>师生与学派</button><button>合作与发现</button><button>思想影响</button></div>`,theme:`<div class="filters"><button class="on">科学家为什么会争论？</button><button>女性如何进入现代科学？</button><button>艺术家为什么需要赞助人？</button></div>`};return shell(`<section class="hero"><div class="eyebrow">不是人物列表，而是历史语境</div><h1>探索一段历史</h1><p>同一个人物可能出现在多个展厅中，因为历史本来就有多种联系。</p><div class="tabs"><button class="${st.lens==='coordinate'?'on':''}" onclick="lens('coordinate')">历史坐标</button><button class="${st.lens==='relationship'?'on':''}" onclick="lens('relationship')">人物关系</button><button class="${st.lens==='theme'?'on':''}" onclick="lens('theme')">事件与主题</button></div></section>${views[st.lens]}<div class="halls"><article class="hall feature"><div class="eyebrow">1927 · 布鲁塞尔</div><h3>第五届索尔维会议</h3><p>自然世界究竟是确定的，还是只能用概率描述？</p><div class="people-dots"><i class="dotface">E</i><i class="dotface">B</i><i class="dotface">C</i><i class="dotface">P</i></div><button class="primary" onclick="go('hall')">进入这段历史</button></article><article class="hall"><div class="eyebrow">1900–1935 · 欧洲</div><h3>量子革命</h3><p>一群科学家如何重新理解光、原子和测量。</p><button class="secondary" onclick="go('hall')">看看展厅</button></article></div>`)}function lens(x){st.lens=x;render()}
function hall(){const roles=[['einstein','E','爱因斯坦','质疑概率是最终答案'],['bohr','B','尼尔斯·玻尔','捍卫新的量子解释'],['curie','C','居里夫人','实验科学家与会议参与者'],['planck','P','普朗克','量子理论的早期开创者']];return shell(`<section class="hero"><div class="coordinate"><strong>1927 年 10 月</strong><span>·</span><strong>布鲁塞尔</strong></div><h1>第五届索尔维会议</h1><div class="question">“自然世界究竟是确定的，还是只能用概率描述？”</div><p>世界顶尖物理学家在这里讨论刚刚成形的量子理论。争论并不意味着敌意，而是不同证据和世界观的碰撞。</p></section><div class="roles">${roles.map(r=>`<article class="role ${st.selected===r[0]?'selected':''}" onclick="selectPerson('${r[0]}')"><div class="face">${r[1]}</div><h3>${r[2]}</h3><p>${r[3]}</p>${st.selected===r[0]?`<button class="primary" onclick="event.stopPropagation();go('chat')">和他聊聊</button>`:''}</article>`).join('')}</div><div class="actions" style="justify-content:center"><button class="secondary" onclick="go('map')">查看人物关系与时间</button><button class="primary" onclick="go('chat')">从推荐人物开始</button></div>`)}function selectPerson(x){st.selected=x;render()}
function search(){return shell(`<section class="hero"><div class="eyebrow">不仅找到他，也发现与他相连的人</div><h1>搜索历史人物</h1><p>关系推荐来自已确认的历史资料和人物关系图谱。</p></section><div class="search"><input value="爱因斯坦" aria-label="搜索人物" oninput="toast('原型示例：正式版将按输入实时搜索')"><section class="result-group"><div class="result-label"><b>你搜索的人</b><span>精确匹配</span></div><article class="result exact"><div class="face">E</div><div><h3>阿尔伯特·爱因斯坦</h3><p>1879–1955 · 理论物理学家 · 出现在 3 个历史展厅</p><span class="relation">姓名完全匹配</span></div><button class="primary" onclick="go('person')">查看人物</button></article></section><section class="result-group"><div class="result-label"><b>与爱因斯坦相关的人</b><button class="why" onclick="go('map')">查看关系网络</button></div><article class="result"><div class="face" style="background:var(--coral)">B</div><div><h3>尼尔斯·玻尔</h3><p>1885–1962 · 量子理论的重要奠基者</p><span class="relation">长期学术争论 · 共同参加索尔维会议</span> <button class="why" onclick="toast('关系依据：已审核 Claim 与共同展厅')">为什么推荐？</button></div><button class="secondary" onclick="go('person')">查看人物</button></article><article class="result"><div class="face" style="background:var(--green)">O</div><div><h3>罗伯特·奥本海默</h3><p>1904–1967 · 理论物理学家</p><span class="relation">同在普林斯顿高等研究院 · 有可追溯的历史联系</span> <button class="why" onclick="toast('关系依据：共同组织与历史记录')">为什么推荐？</button></div><button class="secondary" onclick="go('person')">查看人物</button></article><article class="result"><div class="face" style="background:var(--lav)">P</div><div><h3>马克斯·普朗克</h3><p>1858–1947 · 量子理论的早期开创者</p><span class="relation">早期支持相对论 · 学术影响与共同事件</span> <button class="why" onclick="toast('关系依据：正式 Relationship 与来源')">为什么推荐？</button></div><button class="secondary" onclick="go('person')">查看人物</button></article></section></div>`)}
function person(){return shell(`<article class="stage"><div class="person"><div class="face">E</div><div><div class="eyebrow">1879–1955 · 德国 / 瑞士 / 美国</div><h2>阿尔伯特·爱因斯坦</h2><p>理论物理学家，以相对论和对量子理论的贡献闻名。</p><div class="actions"><button class="primary" onclick="go('chat')">开始对话</button><button class="secondary" onclick="go('hall')">他出现在哪些历史中？</button><button class="ghost" onclick="go('search')">返回搜索</button></div></div></div></article><div class="hall-grid"><article class="hall"><div class="eyebrow">1927 · 布鲁塞尔</div><h3>第五届索尔维会议</h3><p>与玻尔的量子争论。</p></article><article class="hall"><div class="eyebrow">1905 · 伯尔尼</div><h3>奇迹年</h3><p>四篇改变物理学的论文。</p></article><article class="hall"><div class="eyebrow">1933 · 欧洲与美国</div><h3>科学家与流亡</h3><p>政治变化如何改变科学共同体。</p></article></div>`)}
function chat(){return shell(`<section class="chat"><header class="chat-head"><div class="face">E</div><div><b>爱因斯坦</b><div class="eyebrow">人物资料 1.2</div></div><div class="context">从「第五届索尔维会议」进入</div></header><main class="messages"><div class="bubble user">你为什么不同意玻尔？</div><div class="bubble ai">我并不是反对量子理论取得的成果。我怀疑的是：概率是否真的是自然最后、最完整的描述。玻尔认为新的理论已经要求我们改变提问方式。<div class="inline"><button onclick="toast('打开逐句史料抽屉')">✓ 看看依据</button><button onclick="go('hall')">回到索尔维会议</button><button onclick="go('map')">看看这些人怎么相连</button></div></div></main><form class="composer" onsubmit="event.preventDefault();toast('模拟发送；不会调用真实 API')"><input placeholder="继续问爱因斯坦……"><button class="primary">发送</button></form></section>`)}
function map(){return shell(`<section class="hero"><div class="eyebrow">第五届索尔维会议</div><h1>这些人怎样相连？</h1><div class="tabs"><button class="on">人物关系</button><button onclick="toast('切换为 1900–1935 时间线')">历史时间</button><button onclick="go('hall')">返回展厅</button></div></section><div class="map"><button class="node main" onclick="go('chat')">爱因斯坦</button><button class="node a">普朗克<br>早期影响</button><button class="node b" onclick="go('chat')">玻尔<br>长期争论</button><button class="node c">居里夫人<br>共同参会</button><button class="node d">量子理论<br>共同主题</button></div>`)}
function me(){return shell(`<section class="hero"><div class="eyebrow">我的探索</div><h1>你走过的历史线索</h1></section><div class="me-grid"><article class="card"><h3>最近的人物</h3><p>爱因斯坦 · 刚刚<br>玻尔 · 2 天前</p><button class="primary" onclick="go('chat')">继续对话</button></article><article class="card"><h3>最近的展厅</h3><p>第五届索尔维会议<br>量子革命</p><button class="secondary" onclick="go('hall')">回到展厅</button></article><article class="card"><h3>正在探索</h3><p>量子理论 · 正在练习</p><button class="secondary" onclick="toast('学习主题、记忆和历史沿用 v2 流程')">查看主题</button></article></div>`)}
st.searchOpen=false;
function openSearch(){if(st.searchOpen)return;st.searchOpen=true;document.body.classList.add('search-open');document.body.insertAdjacentHTML('beforeend',searchOverlay());setTimeout(()=>document.querySelector('#floating-search')?.focus(),0)}
function closeSearch(){st.searchOpen=false;document.body.classList.remove('search-open');document.querySelector('.search-overlay')?.remove()}
function chooseSearchResult(route){closeSearch();go(route)}
function searchOverlay(){if(!st.searchOpen)return '';return `<div class="search-overlay" role="presentation" onclick="closeSearch()"><section class="search-modal" role="dialog" aria-modal="true" aria-label="搜索历史人物" onclick="event.stopPropagation()"><header class="search-modal-head"><label><span>⌕</span><input id="floating-search" value="爱因斯坦" aria-label="搜索人物或关系" oninput="toast('原型示例：正式版将按输入实时搜索')"></label><button class="close-search" aria-label="关闭搜索" onclick="closeSearch()">×</button></header><p class="search-origin">搜索结束后，你仍会回到「${labels[st.route]}」的当前位置。</p><section class="result-group"><div class="result-label"><b>你搜索的人</b><span>精确匹配</span></div><article class="result exact"><div class="face">E</div><div><h3>阿尔伯特·爱因斯坦</h3><p>1879–1955 · 理论物理学家 · 出现在 3 个历史展厅</p><span class="relation">姓名完全匹配</span></div><button class="primary" onclick="chooseSearchResult('person')">查看人物</button></article></section><section class="result-group"><div class="result-label"><b>与爱因斯坦相关的人</b><button class="why" onclick="chooseSearchResult('map')">查看关系网络</button></div><article class="result"><div class="face" style="background:var(--coral)">B</div><div><h3>尼尔斯·玻尔</h3><p>1885–1962 · 量子理论的重要奠基者</p><span class="relation">长期学术争论 · 共同参加索尔维会议</span> <button class="why" onclick="toast('关系依据：已审核 Claim 与共同展厅')">为什么推荐？</button></div><button class="secondary" onclick="chooseSearchResult('person')">查看人物</button></article><article class="result"><div class="face" style="background:var(--green)">O</div><div><h3>罗伯特·奥本海默</h3><p>1904–1967 · 理论物理学家</p><span class="relation">同在普林斯顿高等研究院 · 有可追溯的历史联系</span> <button class="why" onclick="toast('关系依据：共同组织与历史记录')">为什么推荐？</button></div><button class="secondary" onclick="chooseSearchResult('person')">查看人物</button></article><article class="result"><div class="face" style="background:var(--lav)">P</div><div><h3>马克斯·普朗克</h3><p>1858–1947 · 量子理论的早期开创者</p><span class="relation">早期支持相对论 · 学术影响与共同事件</span> <button class="why" onclick="toast('关系依据：正式 Relationship 与来源')">为什么推荐？</button></div><button class="secondary" onclick="chooseSearchResult('person')">查看人物</button></article></section></section></div>`}
nav=function(){return `<header class="top"><div class="brand">AI Museum</div><nav class="nav"><button class="${st.route==='home'?'on':''}" onclick="go('home')">主页</button><button class="${['explore','hall','map'].includes(st.route)?'on':''}" onclick="go('explore')">探索历史</button><button class="${st.route==='me'?'on':''}" onclick="go('me')">我的探索</button></nav><label class="quick-search" onclick="openSearch()"><span>⌕</span><input aria-label="搜索人物或关系" placeholder="搜索人物或关系" readonly></label><button class="avatar" onclick="toast('模式 · 帮助 · 隐私')">小宇</button></header>`};
shell=function(c){return `${proto()}<div class="shell">${nav()}<main class="main">${c}</main></div>`};
go=function(r){if(r==='search'){openSearch();return}st.route=r;location.hash=r;render();scrollTo(0,0)};
function render(){document.body.dataset.theme=st.theme;document.querySelector('#app').innerHTML=(window[st.route]||home)()}window.addEventListener('keydown',e=>{if(e.key==='Escape'&&st.searchOpen)closeSearch()});window.addEventListener('hashchange',()=>{const r=location.hash.slice(1);if(labels[r]){st.route=r;render()}});if(labels[location.hash.slice(1)])st.route=location.hash.slice(1);const openSearchOnLoad=st.route==='search';if(openSearchOnLoad)st.route='home';render();if(openSearchOnLoad)openSearch();
</script></body></html>
